   <div class="panel"><h3>월별 정산</h3><table class="ptable"><thead><tr><th>월</th><th>측정 결제</th><th>수수료</th><th>상태</th></tr></thead><tbody>
    ${[['8월',1204000,'지급 완료'],['9월',2960000,'지급 완료'],['10월',tot,'11.10 지급 예정']].map(([m,v,st])=>`<tr><td>${m}</td><td class="num">${won(v)}원</td><td class="num">${won(v*FEE)}원</td><td><span class="pill ${st==='지급 완료'?'ok':'warn'}">${st}</span></td></tr>`).join('')}
   </tbody></table></div>
  </div>
  <div class="side-col"><div class="panel"><h3>어떻게 측정하나요</h3>
   <div class="flow"><div><b>1</b>루트 참가자가 매장 QR 스캔</div><div><b>2</b>스캔 후 정해진 시간 안에 카카오페이 결제</div><div><b>3</b>그 결제액의 ${FEE*100}%만 수수료</div></div>
   <p class="walk">현금 · 카드 결제, QR 없이 온 손님은 측정하지 않아요. 측정되지 않으면 수수료도 없어요. 결제 연결은 팬이 동의한 경우에만 생겨요.</p></div></div>
 </div>`);
}

/* 모달 */
function bModal(){
 const m=S.b.modal;if(!m)return '';
 let h='';
 if(m.t==='propose'||m.t==='apply'){
  const s=m.t==='propose'?SP(m.id):ME(),a=m.t==='apply'?A(m.id):null;
  h=`<h3>${m.t==='propose'?esc(s.name)+'에 협업 제안':esc(a.name)+'에 팝업 협업 신청'}</h3><p class="s">${m.t==='propose'?'수락되면 장소 관리에서 스토리를 써서 루트에 넣을 수 있어요.':'수락되면 기간 동안만 성지로 노출되고, 팬 앱에 \'기간 한정\' 라벨이 붙어요.'}</p>
  <div class="fgrid">
   <div class="fld"><label for="mf-from">${m.t==='apply'?'팝업 ':''}시작일</label><input id="mf-from" type="date" value="2026-11-20" min="${TODAY}"></div>
   <div class="fld"><label for="mf-to">${m.t==='apply'?'팝업 ':''}종료일</label><input id="mf-to" type="date" value="2026-12-31" min="${TODAY}"></div>
   <div class="fld"><label for="mf-cap">회차당 인원</label><input id="mf-cap" type="number" min="1" max="${s.cap}" value="${Math.min(10,s.cap)}"><p class="help">${esc(s.name)}은 한 번에 ${s.cap}명까지 받아요</p></div>
   <div class="fld"><label for="mf-menu">한정 메뉴 ${m.t==='propose'?'제안':''}</label><input id="mf-menu" placeholder="예: 애프터글로우 라떼"></div>
  </div>
  <div class="fld"><label>${m.t==='propose'?'요청 항목':'제공할 수 있는 것'}</label><div class="row" style="flex-wrap:wrap">${s.collab.map(c=>`<label class="cbx"><input type="checkbox" name="mf-op" value="${c}" checked>${c}</label>`).join('')}</div></div>
  ${m.t==='apply'?`<div class="fld"><label for="mf-msg">하고 싶은 콜라보</label><textarea id="mf-msg" placeholder="예: 컴백 기념으로 2층을 포토존으로 꾸미고 한정 음료를 낼게요"></textarea></div>`:''}
  <div class="feebox">송객 수수료 <b>측정된 카카오페이 결제의 ${FEE*100}%</b><small>QR 스캔 후 카카오페이로 결제한 금액에만 붙어요. 요율은 정책 확정 전 목업 값이에요.</small></div>`;
 }
 if(m.t==='story'){const p=S.b.places.find(x=>x.id===m.id);
  h=`<h3>${esc(p.name)} 스토리</h3><p class="s">이 장소가 LUMIN의 어떤 장면과 이어지는지 써 주세요. 저장하면 IP 인증이 끝나고 팬 앱에 소속사 인증 배지가 붙어요.</p>
  <div class="fld"><label for="mf-story">스토리</label><textarea id="mf-story" maxlength="120" placeholder="예: 2집 재킷 B버전을 찍은 1층 네온 사인 앞이에요.">${esc(p.story||'')}</textarea><p class="help">10자 이상 · 팬 앱 장소 카드에 그대로 보여요</p></div>`;}
 if(m.t==='public'){
  h=`<h3>공공장소 등록</h3><p class="s">공원·벽화·계단처럼 주인이 없는 장소예요. 공간 인증 없이 스토리만으로 IP 인증을 하고, 스탬프는 GPS 도착 체크로 줘요.</p>
  <div class="fld"><label for="mf-name">장소 이름</label><input id="mf-name" placeholder="예: 성수 연무장길 계단"></div>
  <div class="fld"><label for="mf-story">스토리</label><textarea id="mf-story" maxlength="120" placeholder="예: 〈Afterglow〉 티저에서 멤버들이 앉아 있던 계단이에요."></textarea></div>
  <div class="fld"><label for="mf-rad">GPS 도착 반경</label><select id="mf-rad"><option value="30">30m</option><option value="50" selected>50m</option><option value="100">100m</option></select><p class="help">반경 기준은 아직 정책 미정이에요</p></div>`;}
 return `<div class="bdim" data-act="bclose"></div><div class="bmodal" role="dialog" aria-modal="true" aria-label="${m.t}">${h}<p class="ferr" id="mferr" role="alert"></p>
  <div class="pc-actions"><button class="btn line" data-act="bclose">취소</button><button class="btn dark" data-act="bsend">${{propose:'제안 보내기',apply:'신청 보내기',story:'저장 · IP 인증',public:'등록'}[m.t]}</button></div></div>`;
}

Object.assign(SCREENS,{'b-find':scrFind,'b-space':scrSpace,'b-ipinbox':scrIpInbox,'b-inbox':scrInbox,'b-ipdash':scrIpDash,'b-places':scrPlaces,'b-spdash':scrSpDash,'b-cal':scrCal,'b-edit':scrEdit,'b-ipfind':scrIpFind,'b-report':scrReport});

const bgo=to=>{S.b.modal=null;S.b.editing=null;S.screen=to;render(true);window.scrollTo(0,0)};
const val=id=>(document.getElementById(id)?.value||'').trim();
const ferr=(id,msg)=>{document.getElementById(id).textContent=msg};
Object.assign(ACT,{
 pcgo:d=>d.to?bgo(d.to):toast(`'${esc(d.n)}'은 이번 목업에 없는 메뉴예요`),
 bgotab:d=>{S.b.tab[d.side]=d.t;bgo(d.to)},
 bsearch:()=>{const v=val('bq');if(!v)return;S.b.text=v;S.b.q=parseQuery(v);S.b.addOpen=false;render()},
 bchipx:d=>{S.b.q.chips.splice(+d.i,1);render()},
 baddopen:()=>{S.b.addOpen=!S.b.addOpen;render()},
 badd:d=>{S.b.q.chips.push({k:d.k,v:d.k==='수용'?+d.v:d.v});render()},
 brel:()=>{S.b.related=!S.b.related;render()},
 bcart:d=>{const c=S.b.cart,i=c.indexOf(d.id);
  if(i>=0)c.splice(i,1);
  else if(c.length>=3)return toast('동선 미리보기는 3곳까지 담을 수 있어요');
  else if(c.length&&SP(c[0]).area!==SP(d.id).area)return toast('다른 지역 공간은 한 동선에 담을 수 없어요');
  else c.push(d.id);
  render()},
 bopen:d=>{S.b.sel=d.id;bgo('b-space')},
 bpropose:d=>{S.b.modal={t:'propose',id:d.id};render();document.getElementById('mf-from')?.focus()},
 bapply:d=>{S.b.modal={t:'apply',id:d.id};render();document.getElementById('mf-from')?.focus()},
 bstory:d=>{S.b.modal={t:'story',id:d.id};render();document.getElementById('mf-story')?.focus()},
 bpublic:()=>{S.b.modal={t:'public'};render();document.getElementById('mf-name')?.focus()},
 bclose:()=>{S.b.modal=null;render()},
 btoroute:()=>{bgo('partner');toast('담은 공간은 협업이 확정되고 스토리를 쓰면 이 장소 목록에 들어가요')},
 bsend:()=>{const m=S.b.modal;
  if(m.t==='story'||m.t==='public'){
   const story=val('mf-story'),name=m.t==='public'?val('mf-name'):'';
   if(m.t==='public'&&name.length<2)return ferr('mferr','장소 이름을 입력해 주세요');
   if(story.length<10)return ferr('mferr','스토리를 10자 이상 써 주세요');
   if(m.t==='story')S.b.places.find(x=>x.id===m.id).story=story;
   else S.b.places.push({id:'u'+Date.now(),name,kind:'public',story,from:null,to:null,radius:+val('mf-rad')});
   S.b.modal=null;render();
   return toast(m.t==='story'?'스토리를 저장했어요 · IP 인증 완료<br><span style="opacity:.7">이제 루트 만들기에서 이 장소를 고를 수 있어요</span>':`${esc(name)}을 공공장소로 등록했어요`);
  }
  const s=m.t==='propose'?SP(m.id):ME(),from=val('mf-from'),to=val('mf-to'),cap=+val('mf-cap');
  if(!from||!to)return ferr('mferr','기간을 입력해 주세요');
  if(to<from)return ferr('mferr','종료일이 시작일보다 빨라요');
  if(!(cap>=1&&cap<=s.cap))return ferr('mferr',`회차당 인원은 1~${s.cap}명이에요`);
  const ops=[...document.querySelectorAll('[name=mf-op]:checked')].map(x=>x.value);
  if(!ops.length)return ferr('mferr','항목을 하나 이상 골라 주세요');
  const base={id:'n'+Date.now(),dir:'out',from,to,cap,menu:val('mf-menu')||'—',status:'wait'};
  if(m.t==='propose'){S.b.props.push({...base,side:'ip',who:s.name,space:s.id,ops});S.b.tab.ip='out'}
  else{const a=A(m.id);S.b.props.push({...base,side:'space',who:`${a.name} · ${a.agency}`,ip:a.id,ops:[...ops,'팝업'],popup:true,msg:val('mf-msg')});S.b.tab.space='out'}
  S.b.modal=null;render();
  toast(`${m.t==='propose'?esc(s.name)+'에 협업 제안':esc(A(m.id).name)+'에 협업 신청'}을 보냈어요<br><span style="opacity:.7">협업함에서 확인할 수 있어요</span>`)},
 btab:d=>{S.b.tab[d.side]=d.t;S.b.editing=null;render()},
 bacc:d=>{const p=prop(d.id);p.status='active';
  if(p.side==='ip'&&!S.b.places.some(x=>x.id===p.space))S.b.places.push({id:p.space,name:p.who,kind:p.popup?'popup':'space',story:'',from:p.from,to:p.to,radius:null});
  render();toast(p.side==='ip'?'협업을 시작했어요<br><span style="opacity:.7">장소 관리에서 스토리를 쓰면 IP 인증이 끝나요</span>':'협업을 시작했어요<br><span style="opacity:.7">소속사가 스토리를 쓰고 회차를 열면 캘린더에 도착 예정 인원이 들어와요</span>')},
 bdec:d=>{prop(d.id).status='declined';render();toast('거절했어요. 상대에게는 사유 없이 알림이 가요')},
 bcounter:d=>{S.b.editing=d.id;render();document.getElementById('ce-cap')?.focus()},
 bcancel:()=>{S.b.editing=null;render()},
 bcsend:d=>{const p=prop(d.id),to=val('ce-to'),cap=+val('ce-cap'),max=p.side==='space'?ME().cap:SP(p.space).cap;
  if(!to||to<p.from)return ferr('ferr-'+p.id,'종료일은 시작일 뒤여야 해요');
  if(!(cap>=1&&cap<=max))return ferr('ferr-'+p.id,`회차당 인원은 1~${max}명이에요`);
  Object.assign(p,{to,cap,menu:val('ce-menu')||'—',status:'countered'});S.b.editing=null;render();toast('수정 제안을 보냈어요. 상대가 수락하면 협업이 시작돼요')},
 bcell:d=>{const [i,j]=d.k.split('-').map(Number);
  if(BOOK[i][j])return toast('예약이 있는 시간은 막을 수 없어요');
  S.b.blocked.has(d.k)?S.b.blocked.delete(d.k):S.b.blocked.add(d.k);render()},
 bday:d=>{const i=+d.d,ks=CAL_SLOTS.map((_,j)=>i+'-'+j),off=ks.every(k=>S.b.blocked.has(k));
  if(!off&&BOOK[i].some(Boolean))return toast('예약이 있는 날은 하루 전체를 막을 수 없어요');
  ks.forEach(k=>off?S.b.blocked.delete(k):S.b.blocked.add(k));render()},
 baiok:d=>{const a=S.b.ai[+d.i],s=ME();a.st='ok';(a.cat==='분위기'?s.vibe:s.feat).push(a.tag);render();toast(`'${a.tag}' 태그를 공개했어요 · 공간찾기에 바로 반영돼요`)},
 baino:d=>{S.b.ai[+d.i].st='no';render();toast('거절한 태그는 다시 분석해도 제안하지 않아요')},
 payLink:()=>{S.payLink=!S.payLink;render()},
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&S.b.modal){S.b.modal=null;render()}
 if(e.key==='Enter'&&!e.isComposing&&e.target.id==='bq'){e.preventDefault();ACT.bsearch()}
});
document.addEventListener('input',e=>{
 const k=e.target.dataset.sbind;if(k){const s=ME();s[k]=e.target.type==='number'?+e.target.value:e.target.value}
 if(e.target.id==='bcap'){const v=+e.target.value;if(v>=1&&v<=40){S.b.slotCap=v;render();const c=document.getElementById('bcap');c.focus()}}
});
document.addEventListener('change',e=>{
 const c=e.target.dataset.scol;if(c){const s=ME();e.target.checked?s.collab.push(c):s.collab.splice(s.collab.indexOf(c),1)}
});

rollNick();
render(true);
</script>
</body>
</html>
