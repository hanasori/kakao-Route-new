<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>카카오루트 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ───────── Tokens ───────── */
:root{
  --y:#FEE500; --y-press:#F2D900; --y-soft:#FFF9C4;
  --ink:#191919; --ink2:#3A3A3A; --sub:#6E6E6E; --mute:#A0A0A0;
  --line:#EDEDEB; --line2:#E2E2DF;
  --bg:#FFFFFF; --bg2:#F6F6F4; --bg3:#EFEFEC;
  --warn:#E8481B; --warn-soft:#FFEDE6;
  --ok:#14936A; --ok-soft:#E3F5EE;
  --blue:#2E62C9; --blue-soft:#E9F0FF;
  --chat:#BACEE0; --chat-ink:#556677;
  --map:#F3F1EA; --river:#CBE0EF; --park:#D9EACB;
  --stage:#E9E7E1; --stage-ink:#2B2A27; --stage-sub:#76736B; --stage-line:#D8D5CC; --panel:#F4F2ED;
  --r-s:10px; --r-m:14px; --r-l:18px;
  --ease:cubic-bezier(.22,1,.36,1);
  --shadow-1:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
  --shadow-2:0 12px 40px rgba(25,25,25,.16),0 2px 6px rgba(25,25,25,.06);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --stage:#1B1B1A; --stage-ink:#EDEBE6; --stage-sub:#9C998F; --stage-line:#34332F; --panel:#232321; }
}
:root[data-theme="dark"]{ --stage:#1B1B1A; --stage-ink:#EDEBE6; --stage-sub:#9C998F; --stage-line:#34332F; --panel:#232321; }

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--stage);color:var(--stage-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:break-word}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
svg{display:block;flex:none}

/* ───────── Stage layout ───────── */
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
.side{border-right:1px solid var(--stage-line);padding:28px 22px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:12px;align-items:center}
.brand-mark{width:36px;height:36px;border-radius:11px;background:var(--y);display:grid;place-items:center;color:var(--ink)}
.brand b{display:block;font-size:16px;font-weight:700}
.brand span{font-size:12px;color:var(--stage-sub)}
.nav{display:flex;flex-direction:column;gap:16px}
.nav-g h4{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--stage-sub);margin-bottom:6px;text-transform:uppercase}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;font-size:14px;color:var(--stage-ink);transition:background .15s}
.nav-i:hover{background:var(--panel)}
.nav-i .n{width:20px;font-size:11px;color:var(--stage-sub);font-variant-numeric:tabular-nums}
.nav-i.on{background:var(--stage-ink);color:var(--stage)}
.nav-i.on .n{color:inherit;opacity:.6}
.nav-i .tag{margin-left:auto;font-size:10px;padding:2px 6px;border-radius:6px;border:1px solid currentColor;opacity:.6}
.notes{margin-top:auto;background:var(--panel);border-radius:14px;padding:16px;font-size:13px;line-height:1.6;color:var(--stage-ink)}
.notes h5{font-size:12px;color:var(--stage-sub);font-weight:600;margin-bottom:6px}
.notes ul{padding-left:16px}
.notes li+li{margin-top:4px}
.mnav{display:none}
.stage{display:grid;place-items:center;padding:32px 24px;min-height:100vh}

/* ───────── Device: phone ───────── */
.device{position:relative;transition:width .35s var(--ease)}
.device.phone{width:390px;height:844px;border-radius:56px;background:#0E0E0E;padding:11px;box-shadow:var(--shadow-2),inset 0 0 0 1.5px #2A2A2A}
.device.phone .screen{position:relative;width:100%;height:100%;border-radius:45px;overflow:hidden;background:var(--bg);color:var(--ink);isolation:isolate}
.status{position:absolute;top:0;left:0;right:0;height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 36px;font-size:15px;font-weight:600;z-index:30;background:var(--sb,#fff);transition:background .2s}
.status.dark{color:#fff}
.island{position:absolute;left:50%;top:11px;width:112px;height:32px;margin-left:-56px;border-radius:20px;background:#000}
.sys{display:flex;gap:6px;align-items:center}
.vp{position:absolute;top:47px;left:0;right:0;bottom:0;overflow:hidden}
.home-ind{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#191919;z-index:40;opacity:.85;pointer-events:none}

/* ───────── Device: desktop ───────── */
.device.desktop{width:min(1200px,100%);border-radius:14px;background:#fff;color:var(--ink);box-shadow:var(--shadow-2);overflow:hidden}
.device.desktop .status,.device.desktop .home-ind{display:none}
.device.desktop .screen{position:relative}
.device.desktop .vp{position:relative;top:0}
.chrome{height:40px;background:#F1F1EF;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px;padding:0 14px}
.chrome i{width:11px;height:11px;border-radius:50%;background:#D9D7D1}
.chrome .url{margin-left:14px;flex:1;max-width:460px;height:24px;border-radius:7px;background:#fff;font-size:12px;color:var(--sub);display:flex;align-items:center;padding:0 10px}

/* ───────── Screen primitives ───────── */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.scr.enter{animation:enter .32s var(--ease)}
.scr.enter-back{animation:enterBack .32s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes enterBack{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
.hd{height:52px;display:flex;align-items:center;gap:2px;padding:0 6px;flex:none;position:relative;z-index:5;background:inherit}
.hd h1{font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px}
.hd h1.c{text-align:center;position:absolute;left:56px;right:56px}
.hd-r{display:flex;margin-left:auto}
.sp{width:8px}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;transition:background .15s,transform .1s}
.iconbtn:hover{background:rgba(0,0,0,.05)}
.iconbtn:active{transform:scale(.94)}
.bd{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none}
.bd::-webkit-scrollbar{display:none}
.ft{flex:none;padding:12px 16px 26px;background:var(--bg);border-top:1px solid var(--line)}
.ft .hint{font-size:12.5px;color:var(--sub);text-align:center;margin-bottom:10px}
.btn{height:54px;width:100%;border-radius:var(--r-m);background:var(--y);color:var(--ink);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,transform .1s,opacity .15s}
.btn:hover{background:var(--y-press)}
.btn:active{transform:scale(.985)}
.btn:disabled{background:var(--bg3);color:var(--mute);cursor:not-allowed;transform:none}
.btn.dark{background:var(--ink);color:#fff}
.btn.line{background:#fff;border:1px solid var(--line2)}
.btn.line:hover{background:var(--bg2)}
.btn.sm{height:40px;font-size:14px;border-radius:11px;width:auto;padding:0 14px}
.row{display:flex;align-items:center;gap:8px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:26px 20px 12px}
.sec-h h2{font-size:18px;font-weight:700}
.sec-h small{font-size:13px;color:var(--sub)}
.meta{font-size:13px;color:var(--sub);display:flex;flex-wrap:wrap;align-items:center;gap:0}
.meta span+span::before{content:"";display:inline-block;width:2px;height:2px;border-radius:50%;background:currentColor;margin:0 7px;vertical-align:middle;opacity:.7}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:7px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.neutral{background:var(--bg3);color:var(--ink2)}
.pill.album{background:#FFF4B8;color:#6A5800}
.pill.branch{background:var(--blue-soft);color:var(--blue)}
.pill.ink{background:var(--ink);color:var(--y)}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line2);font-size:14px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;background:#fff;transition:background .15s,color .15s,border-color .15s,transform .1s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.dim{color:var(--mute);border-style:dashed}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

/* ───────── Toast & sheet ───────── */
.toast{position:absolute;left:16px;right:16px;bottom:104px;z-index:60;background:rgba(25,25,25,.94);color:#fff;border-radius:14px;padding:13px 16px;font-size:14px;line-height:1.45;display:flex;gap:10px;align-items:flex-start;animation:toast .3s var(--ease);pointer-events:none}
.toast.out{animation:toastOut .25s ease forwards}
@keyframes toast{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(6px)}}
.dim-bg{position:absolute;inset:0;background:rgba(0,0,0,.38);z-index:50;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;background:#fff;border-radius:24px 24px 0 0;padding:10px 20px 30px;animation:sheet .34s var(--ease);max-height:86%;overflow:auto}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 18px}
.sheet h3{font-size:20px;font-weight:700;line-height:1.35}
.sheet p.s{font-size:14px;color:var(--sub);margin-top:6px;line-height:1.5}
.sheet.pop{left:20px;right:20px;bottom:auto;top:50%;transform:translateY(-50%);border-radius:22px;padding:24px 20px 20px;animation:popIn .25s var(--ease)}
.sheet.pop h3{font-size:18px}
.sheet.pop p.s{font-size:14.5px;color:var(--ink2);margin-top:10px;line-height:1.6}
@keyframes popIn{from{opacity:0;transform:translateY(-46%) scale(.96)}to{opacity:1;transform:translateY(-50%)}}

/* ───────── KakaoTalk more tab ───────── */
.kt-prof{display:flex;align-items:center;gap:14px;padding:10px 20px 18px}
.kt-prof .av{width:52px;height:52px;border-radius:20px;background:linear-gradient(135deg,#C9D6E3,#A9BBCC)}
.kt-prof b{font-size:17px}
.kt-prof small{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.kt-pay{margin:0 16px;border-radius:16px;background:var(--bg2);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.kt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 4px;padding:24px 12px 8px}
.kt-it{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);position:relative}
.kt-it .ico{width:50px;height:50px;border-radius:17px;background:var(--bg2);display:grid;place-items:center;color:var(--ink2);transition:transform .15s}
.kt-it:active .ico{transform:scale(.94)}
.kt-it.route .ico{background:var(--y);color:var(--ink);box-shadow:0 0 0 4px #fff,0 0 0 6px var(--ink)}
.kt-it.route{font-weight:700;color:var(--ink)}
.kt-it .new{position:absolute;top:-6px;right:8px;background:var(--warn);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:8px;letter-spacing:0}
.coach{margin:14px 16px 0;background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.5;position:relative}
.coach::before{content:"";position:absolute;top:-7px;left:50%;margin-left:-7px;border:7px solid transparent;border-top:0;border-bottom-color:var(--ink)}
.coach b{color:var(--y)}
.kt-list{padding:20px 0 0}
.kt-li{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;font-size:15px}
.tabbar{flex:none;height:84px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px 26px;background:#fff}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mute)}
.tabbar .on{color:var(--ink);font-weight:600}

/* ───────── Route home ───────── */
.search{margin:6px 16px 0;height:46px;border-radius:13px;background:var(--bg2);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--sub)}
.search input{flex:1;border:0;background:none;outline:none;font-size:15px;color:var(--ink);min-width:0}
.search input::placeholder{color:var(--mute)}
.iprow{display:flex;gap:14px;overflow-x:auto;padding:2px 20px 4px;scrollbar-width:none}
.iprow::-webkit-scrollbar{display:none}
.ip{width:66px;flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2)}
.ip .ring{width:66px;height:66px;border-radius:50%;padding:3px;background:var(--line);display:grid;place-items:center;transition:transform .15s}
.ip:active .ring{transform:scale(.95)}
.ip.new .ring{background:conic-gradient(from 200deg,#FEE500,#FF9F1C,#E8481B,#FEE500)}
.ip .av{width:100%;height:100%;border-radius:50%;border:2.5px solid #fff;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;letter-spacing:-.02em;text-shadow:0 1px 6px rgba(0,0,0,.18)}
.ip .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ip.new .nm{font-weight:700;color:var(--ink)}
.ip.add .ring{background:none;border:1.5px dashed var(--line2)}
.ip.add .av{border:0;color:var(--sub);background:var(--bg2)}
.scard{display:block;width:calc(100% - 32px);margin:0 16px 10px;text-align:left;padding:16px 16px 14px;border-radius:var(--r-l);border:1px solid var(--line);background:#fff;transition:transform .12s,box-shadow .2s}
.scard:hover{box-shadow:var(--shadow-1)}
.scard:active{transform:scale(.99)}
.scard .who{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--sub);font-weight:500}
.mini-av{width:20px;height:20px;border-radius:50%;flex:none}
.scard h3{font-size:16.5px;font-weight:700;margin:8px 0 6px;line-height:1.35}
.scard .bot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line2)}
.scard .when{font-size:14.5px;font-weight:600}
.scard.mine{background:var(--y);border-color:var(--y)}
.scard.mine .who{color:var(--ink2)}
.scard.mine .bot{border-top-color:rgba(0,0,0,.14)}
.scard.mine .meta{color:var(--ink2)}
.empty-note{margin:6px 16px 0;padding:14px 16px;border-radius:14px;background:var(--bg2);font-size:13.5px;color:var(--sub);line-height:1.55;display:flex;gap:10px}
.results{padding:8px 0}
.res{display:flex;align-items:center;gap:12px;padding:10px 20px;width:100%;text-align:left}
.res:hover{background:var(--bg2)}
.res .av{width:44px;height:44px;border-radius:50%}
.res b{font-size:15px}
.res small{display:block;font-size:12.5px;color:var(--sub)}
.res .ck.on{background:var(--ink);border-color:var(--ink);color:var(--y)}
.ip{position:relative}
.ip.picked .ring{background:var(--ink)}
.ip .pk{position:absolute;top:0;right:0;width:22px;height:22px;border-radius:50%;background:var(--y);color:var(--ink);border:2px solid #fff;display:grid;place-items:center;animation:pop .3s var(--ease)}
.ipgrid-m{display:grid;grid-template-columns:repeat(4,1fr);justify-items:center;gap:16px 4px;padding:2px 12px 4px}
.ob-steps{display:flex;gap:6px;padding:4px 24px 0}
.ob-steps i{height:4px;flex:1;border-radius:2px;background:var(--bg3)}
.ob-steps i.on{background:var(--ink)}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:24px 16px 20px}
.catc{position:relative;text-align:left;border:1px solid var(--line2);border-radius:18px;padding:16px;min-height:136px;display:flex;flex-direction:column;gap:4px;background:#fff;transition:border-color .15s,background .15s,transform .1s}
.catc:active{transform:scale(.98)}
.catc .ce{width:44px;height:44px;border-radius:14px;background:var(--bg2);display:grid;place-items:center;margin-bottom:8px;transition:background .15s}
.catc b{font-size:16px}
.catc small{font-size:12px;color:var(--sub);line-height:1.4}
.catc .ck{position:absolute;top:12px;right:12px}
.catc.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--y-soft)}
.catc.on .ce{background:var(--y)}
.catc.on .ck{background:var(--ink);border-color:var(--ink);color:var(--y)}
.sortbtn{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--sub);height:32px;padding:0 8px;border-radius:9px}
.sortbtn:hover{background:var(--bg2)}
.sec-h .sortbtn{margin:-6px -8px -6px 0;align-self:center}
.pager{display:flex;justify-content:center;gap:4px;padding:4px 0 0}
.pager button{min-width:36px;height:36px;border-radius:10px;font-size:14px;font-weight:600;color:var(--sub);display:grid;place-items:center;transition:background .15s}
.pager button:hover{background:var(--bg2)}
.pager button.on{background:var(--ink);color:#fff}
.pager button:disabled{opacity:.3;cursor:default;background:none}
.optrow{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 4px;border-top:1px solid var(--line);font-size:16px;text-align:left}
.optrow:first-child{border-top:0}
.optrow.on{font-weight:700}

/* ───────── Artist home ───────── */
.hero{position:relative;height:288px;flex:none;color:#fff;overflow:hidden}
.hero .art{position:absolute;inset:0;transition:opacity .35s ease}
.hero .art svg{width:100%;height:100%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 45%,rgba(0,0,0,.62) 100%);pointer-events:none}
.hero .hd{position:absolute;top:0;left:0;right:0;background:none;color:#fff;z-index:3}
.hero .hd .iconbtn:hover{background:rgba(255,255,255,.14)}
.hero .txt{position:absolute;left:20px;right:20px;bottom:18px;z-index:3;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hero h2{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.hero h2 small{font-size:17px;font-weight:600;opacity:.9;margin-left:6px;letter-spacing:-.01em}
.hero .ver{display:flex;align-items:center;gap:5px;font-size:13.5px;margin-top:8px;opacity:.95}
.follow{height:36px;padding:0 14px;border-radius:18px;background:var(--y);color:var(--ink);font-size:14px;font-weight:700;display:flex;align-items:center;gap:4px;flex:none}
.follow.on{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(6px);font-weight:600}
.sticky{position:sticky;top:0;z-index:4;background:#fff;padding-top:14px;box-shadow:0 1px 0 var(--line)}
.seg{margin:12px 16px 12px;background:var(--bg2);border-radius:12px;padding:4px;display:grid;grid-template-columns:1fr 1fr;position:relative}
.seg button{height:38px;border-radius:9px;font-size:14.5px;font-weight:600;color:var(--sub);position:relative;z-index:1;transition:color .2s}
.seg button.on{color:var(--ink)}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:9px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1);transition:transform .28s var(--ease)}
.seg.r .thumb{transform:translateX(100%)}
.rlist{padding:14px 0 20px}
.rcard{margin:0 16px 10px;border-radius:var(--r-l);border:1px solid var(--line);background:#fff;transition:border-color .2s,box-shadow .2s}
.rcard.open{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.rcard .top{width:100%;text-align:left;padding:16px;display:block}
.rcard h3{font-size:16.5px;font-weight:700;margin:8px 0 6px;line-height:1.35}
.rcard .tags{display:flex;gap:6px;align-items:center}
.rcard .tags .mt{font-size:12px;color:var(--sub)}
.rcard .more{padding:0 16px 16px;animation:fade .25s ease}
.stops{display:flex;flex-direction:column;gap:0;margin:2px 0 14px;padding:12px 14px;border-radius:12px;background:var(--bg2)}
.stop{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--ink2);padding:4px 0;position:relative}
.stop i{width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--y);font-size:11px;font-weight:700;font-style:normal;display:grid;place-items:center;flex:none}
.stop+.stop::before{content:"";position:absolute;left:9.5px;top:-6px;height:8px;width:1px;background:var(--line2)}
button.stop{width:100%;text-align:left;border-radius:8px;transition:color .15s}
button.stop .go{margin-left:auto;color:var(--mute);opacity:0;transition:opacity .15s}
button.stop:hover .go,button.stop.on .go{opacity:1}
button.stop.on{color:var(--ink);font-weight:700}
button.stop.on i{background:var(--y);color:var(--ink)}
.mapbox.rmap{margin:2px 0 10px}
.mz{transform-origin:0 0;transition:transform .6s var(--ease)}
.mz g.fx>circle:not([fill="transparent"]){stroke:var(--y);stroke-width:4}
.bias-h{display:inline-flex;color:#F0506E;margin-left:-2px}
.slbl{font-size:13px;font-weight:600;color:var(--sub);margin-bottom:8px}
.schips{display:flex;gap:8px;flex-wrap:wrap}
.schip{height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);font-size:14px;display:flex;align-items:center;gap:6px;transition:all .15s;background:#fff}
.schip b{font-weight:700}
.schip .l{color:var(--sub)}
.schip .l.w{color:var(--warn);font-weight:600}
.schip.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--y-soft)}
.schip:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.empty{padding:40px 28px;text-align:center;color:var(--sub);font-size:14px;line-height:1.6}
.empty .e-ic{width:52px;height:52px;border-radius:18px;background:var(--bg2);display:grid;place-items:center;margin:0 auto 14px;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* free explore */
.steps{display:flex;gap:6px;padding:0 20px 12px;font-size:12.5px;color:var(--mute);align-items:center}
.steps .on{color:var(--ink);font-weight:700}
.steps i{width:18px;height:18px;border-radius:50%;background:var(--bg3);display:inline-grid;place-items:center;font-style:normal;font-size:11px;margin-right:4px}
.steps .on i{background:var(--ink);color:var(--y)}
.mapbox{margin:0 16px;border-radius:16px;overflow:hidden;border:1px solid var(--line);position:relative}
.mapbox>svg{width:100%;height:auto}
.mapbox .legend{position:absolute;left:10px;bottom:10px;font-size:11.5px;background:rgba(255,255,255,.92);padding:5px 9px;border-radius:8px;color:var(--ink2);font-weight:600}
.plist{padding:10px 0 16px}
.prow{display:flex;gap:12px;align-items:flex-start;padding:12px 20px;width:100%;text-align:left;transition:background .15s}
.prow:hover{background:var(--bg2)}
.ck{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;margin-top:1px;transition:all .15s;font-size:12px;font-weight:800}
.prow.on .ck{background:var(--ink);border-color:var(--ink);color:var(--y)}
.prow b{font-size:15px;display:flex;align-items:center;gap:6px}
.prow p{font-size:13px;color:var(--sub);margin-top:3px;line-height:1.45}
.vbadge{display:inline-flex;align-items:center;gap:2px;font-size:11px;color:var(--blue);font-weight:600}
.myroute{margin:0 16px;padding:16px;border-radius:16px;background:var(--bg2)}
.myroute .seq{font-size:14px;line-height:1.7;margin-top:8px;color:var(--ink2)}
.myroute .seq b{color:var(--ink)}
.party{margin:0 16px 10px;padding:16px;border-radius:16px;border:1px solid var(--line);display:flex;gap:14px;align-items:center}
.party .info{flex:1;min-width:0}
.party h4{font-size:15.5px;font-weight:700}
.party{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.party.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.party .radio{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center;transition:all .15s}
.party.sel .radio{border-color:var(--ink);background:var(--ink);color:var(--y)}
.ovrow{display:flex;align-items:center;gap:8px;margin-top:10px}
.ovlbl{font-size:12.5px;color:var(--sub);font-weight:600;white-space:nowrap}
.ovbox{display:flex;gap:4px;flex-wrap:wrap}
.ovbox i,.ovd i{width:22px;height:22px;border-radius:6px;background:var(--bg3);color:var(--mute);font:700 11px/22px var(--font);text-align:center;font-style:normal;flex:none}
.ovbox i.hit,.ovd .hit i{background:var(--ok);color:#fff}
.ovd{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--bg2);display:flex;flex-direction:column;gap:6px;animation:fade .25s ease;cursor:default}
.ovd div{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.ovd div.hit{color:var(--ink2)}
.ovd small{margin-left:auto;font-size:11.5px;white-space:nowrap}
.ovd div.hit small{color:var(--ok);font-weight:600}
.xbtn{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--sub);flex:none;transition:transform .25s var(--ease),background .15s;margin-left:auto}
.xbtn:hover{background:var(--bg3)}
.xbtn.up{transform:rotate(180deg)}
.rtrunc{margin:10px 16px 0;padding:8px 6px 8px 14px;border-radius:14px;background:var(--bg2);display:flex;align-items:center;gap:6px}
.seq1{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;color:var(--ink2)}
.seq1 b{color:var(--ink)}
.rfull{margin:8px 16px 0;padding:14px 16px;border-radius:14px;border:1px solid var(--line);animation:fade .25s ease}
.seats{display:flex;gap:3px;margin-top:10px}
.seats i{width:14px;height:6px;border-radius:3px;background:var(--line2)}
.seats i.f{background:var(--ink)}
.newparty{margin:6px 16px 16px;padding:16px;border-radius:16px;border:1.5px dashed var(--line2);width:calc(100% - 32px);text-align:left;display:flex;gap:12px;align-items:center;transition:background .15s}
.newparty:hover{background:var(--bg2)}
.newparty .pl{width:40px;height:40px;border-radius:12px;background:var(--y);display:grid;place-items:center;flex:none}
.newparty b{font-size:15px}
.newparty small{display:block;font-size:12.5px;color:var(--sub);margin-top:2px;line-height:1.45}

/* entry */
.entry-h{padding:12px 24px 0}
.entry-h h2{font-size:25px;font-weight:800;line-height:1.3;letter-spacing:-.03em}
.entry-h p{margin-top:8px;font-size:15px;color:var(--sub)}
.nick{margin:24px 16px 0;padding:18px;border-radius:18px;background:var(--bg2);display:flex;align-items:center;gap:14px}
.nick .av{width:50px;height:50px;border-radius:18px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:18px;flex:none}
.nick small{font-size:12px;color:var(--sub)}
.nick b{display:block;font-size:17px;margin-top:2px;animation:fade .3s ease}
.nick .iconbtn{margin-left:auto;background:#fff;border:1px solid var(--line2)}
.rules{margin:28px 16px 0}
.rules h4{font-size:15px;font-weight:700;padding:0 4px 10px;display:flex;justify-content:space-between;align-items:center}
.rules h4 button{font-size:13px;color:var(--blue);font-weight:600}
.rule{display:flex;gap:12px;padding:14px 4px;width:100%;text-align:left;border-top:1px solid var(--line);font-size:15px;align-items:center}
.rule .ck{border-radius:50%}
.rule.on .ck{background:var(--ink);border-color:var(--ink);color:var(--y)}
.rule span small{display:block;font-size:12.5px;color:var(--sub);margin-top:2px}
.rule-wrap{display:flex;align-items:center;border-top:1px solid var(--line)}
.rule-wrap .rule{border-top:0;flex:1}
.rule-wrap .iconbtn{color:var(--sub);flex:none;margin-right:-8px}
.headcount{margin:20px 16px 0;padding:14px 16px;border-radius:14px;border:1px solid var(--line);display:flex;align-items:center;gap:12px;font-size:14px}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line2)}
.dots i.f{background:var(--ink)}
.dots i.me{background:var(--y);box-shadow:inset 0 0 0 1.5px var(--ink)}
.dots.ok i.f,.seats.ok i.f{background:var(--ok)}
.dots.ok i.me{background:var(--ok);box-shadow:inset 0 0 0 1.5px #fff}
.headcount.ok{border-color:var(--ok);background:var(--ok-soft)}
.okt{color:var(--ok);font-weight:700}
.needt{color:var(--ink);font-weight:700}

/* calendar */
.calm{margin:0 16px;padding:14px 10px 10px;border-radius:16px;border:1px solid var(--line)}
.calm-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 6px 10px}
.calm-h b{font-size:15px}
.calm-h small{font-size:12px;color:var(--sub)}
.calm-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calm-g .w{font-size:11.5px;color:var(--mute);padding:2px 0 6px}
.cd{height:40px;border-radius:12px;font-size:14px;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums;transition:background .15s,color .15s}
.cd:disabled{cursor:default}
.cd.on{color:var(--ink);font-weight:700}
.cd.on::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--ink)}
.cd.on:hover{background:var(--bg2)}
.cd.sel,.cd.sel:hover{background:var(--ink);color:var(--y)}
.cd.sel::after{background:var(--y)}
.cd.today{box-shadow:inset 0 0 0 1px var(--line2)}
.times{padding:14px 20px 0}

/* ───────── Chat ───────── */
.chat{background:var(--chat)}
.chat .hd{background:var(--chat)}
.chat .hd h1 small{font-size:14px;color:var(--chat-ink);font-weight:500;margin-left:4px}
.pin{margin:0 10px;border-radius:14px;background:rgba(255,255,255,.94);padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(40,60,80,.08);flex:none;position:relative;z-index:4}
.pin .ic{width:34px;height:34px;border-radius:10px;background:var(--y);display:grid;place-items:center;flex:none}
.pin .t{flex:1;min-width:0}
.pin b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin small{font-size:12px;color:var(--sub)}
.chat .bd{padding:14px 12px 10px}
.m-sys{text-align:center;margin:10px 0}
.m-sys span{display:inline-block;font-size:12px;color:#fff;background:rgba(60,80,100,.28);padding:4px 11px;border-radius:11px;line-height:1.5}
.m-date span{background:rgba(60,80,100,.18)}
.m{display:flex;gap:8px;margin:6px 0;align-items:flex-start;animation:msg .28s var(--ease)}
@keyframes msg{from{opacity:0;transform:translateY(6px)}}
.m .av{width:38px;height:38px;border-radius:15px;flex:none;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff}
.m .av.k{background:var(--ink);color:var(--y);font-size:16px}
.m .av.ghost{visibility:hidden;height:0}
.m .col{max-width:76%;display:flex;flex-direction:column;gap:4px;min-width:0}
.m .nm{font-size:12px;color:var(--chat-ink);padding-left:2px}
.m .nm.k{color:var(--ink);font-weight:700}
.m .nm.k small{font-weight:500;color:var(--chat-ink);margin-left:4px}
.m .ln{display:flex;align-items:flex-end;gap:5px}
.bub{background:#fff;padding:9px 12px;border-radius:4px 16px 16px 16px;font-size:14.5px;line-height:1.5;white-space:pre-wrap}
.m .tm{font-size:10.5px;color:var(--chat-ink);flex:none;white-space:nowrap}
.m.me{justify-content:flex-end}
.m.me .ln{flex-direction:row-reverse}
.m.me .bub{background:var(--y);border-radius:16px 4px 16px 16px}
.m.k .bub{border-radius:4px 16px 16px 16px}
.typing .bub{display:flex;gap:4px;padding:13px 14px}
.typing .bub i{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:dot 1s infinite}
.typing .bub i:nth-child(2){animation-delay:.15s}.typing .bub i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.card{background:#fff;border-radius:4px 16px 16px 16px;overflow:hidden;width:252px;flex:none}
.m.wide .col{max-width:calc(100% - 46px)}
.card-h{padding:12px 14px 0;font-size:12px;font-weight:700;color:var(--sub);display:flex;gap:6px;align-items:center}
.card-q{padding:6px 14px 0;font-size:15px;font-weight:700;line-height:1.4}
.card-b{padding:12px 14px 14px}
.card-f{padding:10px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--sub);display:flex;flex-direction:column;gap:2px}
.applied{margin:10px 14px 0;padding:9px 11px;border-radius:9px;background:var(--ok-soft);color:var(--ok);font-size:12.5px;font-weight:600;display:flex;gap:6px;align-items:center}
.amt{font-size:26px;font-weight:800;letter-spacing:-.03em}
.amt small{display:block;font-size:13px;font-weight:600;color:var(--sub);letter-spacing:0;margin-top:2px}
.tgt{display:flex;flex-direction:column;margin-top:12px;border-top:1px solid var(--line)}
.tgt button{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13.5px;text-align:left;width:100%}
.tgt .ck{width:20px;height:20px;border-radius:6px}
.tgt button.on .ck{background:var(--ink);border-color:var(--ink);color:var(--y)}
.tgt .st{margin-left:auto;font-size:12px;color:var(--mute)}
.tgt .st.paid{color:var(--ok);font-weight:600}
.paybtn{margin-top:10px;height:44px;width:100%;border-radius:11px;background:var(--y);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.paybtn:disabled{background:var(--bg3);color:var(--mute)}
.paybtn .pay{background:var(--ink);color:var(--y);font-size:10.5px;font-weight:800;padding:2px 5px;border-radius:5px;letter-spacing:.02em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.two button{height:42px;border-radius:10px;font-size:14px;font-weight:700;border:1px solid var(--line2)}
.two button.y{background:var(--y);border-color:var(--y)}
.inbar{flex:none;background:#fff;padding:8px 8px 28px;display:flex;align-items:center;gap:4px}
.inbar .field{flex:1;min-width:0;height:40px;border-radius:20px;background:var(--bg2);display:flex;align-items:center;padding:0 6px 0 14px;gap:4px}
.inbar input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15px}
.atk{height:30px;padding:0 9px;border-radius:15px;background:var(--ink);color:var(--y);font-size:12.5px;font-weight:700;flex:none;white-space:nowrap}
.send{width:40px;height:40px;border-radius:50%;background:var(--y);display:grid;place-items:center;flex:none;transition:opacity .15s}
.send:disabled{background:var(--bg3);color:var(--mute)}
.suggest{display:flex;gap:6px;padding:8px 10px 0;background:#fff;overflow-x:auto;scrollbar-width:none;flex:none}
.suggest button{height:30px;padding:0 11px;border-radius:15px;border:1px solid var(--line2);font-size:12.5px;white-space:nowrap;color:var(--ink2)}

/* ───────── Live ───────── */
.live .mapfull{position:relative;flex:none;background:var(--map);padding-top:58px}
.live .mapfull>svg{width:100%;height:auto}
.kmap{width:100%;aspect-ratio:360/250;background:var(--map)}
.kpin{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--y);border:2.5px solid #fff;font:700 12px/1 var(--font);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.kpin.done{background:#fff;color:var(--ink);border-color:var(--ink)}
.kpin.next{background:var(--y);color:var(--ink);transform:scale(1.15)}
.kme{width:14px;height:14px;border-radius:50%;background:#2E62C9;border:3px solid #fff;box-shadow:0 0 0 8px rgba(46,98,201,.18)}
.live .float-hd{position:absolute;top:10px;left:12px;right:12px;display:flex;align-items:center;gap:8px;z-index:3}
.live .float-hd .iconbtn{background:#fff;box-shadow:var(--shadow-1);width:40px;height:40px}
.live .float-hd .ttl{flex:1;height:40px;border-radius:12px;background:#fff;box-shadow:var(--shadow-1);display:flex;align-items:center;padding:0 12px;font-size:14px;font-weight:700;gap:8px}
.live .dist{position:absolute;right:12px;bottom:12px;background:var(--ink);color:#fff;padding:8px 12px;border-radius:12px;font-size:13px;z-index:3}
.live .dist b{color:var(--y);font-size:15px}
.lsheet{flex:1;border-radius:22px 22px 0 0;background:#fff;margin-top:-18px;position:relative;z-index:4;padding:10px 20px 0;overflow:auto;box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.next{display:flex;gap:12px;align-items:center}
.next .no{width:42px;height:42px;border-radius:14px;background:var(--y);display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.next small{font-size:12.5px;color:var(--sub)}
.next b{display:block;font-size:17px;margin-top:1px}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.12)}100%{transform:none}}
.puzrow{display:flex;gap:18px;align-items:center;margin:18px 0 4px}
.puz{width:144px;height:180px;flex:none;border-radius:14px;overflow:hidden}
.puz .sil{filter:grayscale(1) blur(2.5px);opacity:.28}
.puz .pz-in{animation:pzIn .6s var(--ease);transform-box:fill-box;transform-origin:center}
@keyframes pzIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.puzinfo b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em}
.puzinfo small{display:block;font-size:13.5px;color:var(--sub);line-height:1.5;margin-top:4px}
.qrcard{margin-top:16px;padding:18px;border-radius:16px;background:var(--ink);color:var(--y);display:flex;flex-direction:column;align-items:center;gap:12px;animation:pop .5s var(--ease)}
.qrcard b{font-size:15px}
.qrbox{width:156px;height:156px;border-radius:12px;background:#fff;padding:8px;display:block}
.kline{margin-top:16px;display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--bg2);font-size:14px;line-height:1.5;animation:fade .35s ease}
.kline .av{width:28px;height:28px;border-radius:10px;background:var(--ink);color:var(--y);font-weight:800;display:grid;place-items:center;flex:none;font-size:13px}
.scan{position:absolute;inset:0;z-index:55;background:#0B0B0B;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;animation:fade .2s ease}
.scan .frame{width:230px;height:230px;position:relative;border-radius:20px;background:radial-gradient(circle at 50% 50%,#2a2a2a,#141414)}
.scan .frame::before,.scan .frame::after{content:"";position:absolute;inset:-3px;border-radius:22px;border:3px solid var(--y);clip-path:polygon(0 0,28% 0,28% 6%,6% 6%,6% 28%,0 28%,0 72%,6% 72%,6% 94%,28% 94%,28% 100%,72% 100%,72% 94%,94% 94%,94% 72%,100% 72%,100% 28%,94% 28%,94% 6%,72% 6%,72% 0,100% 0,100% 100%,0 100%)}
.scan .frame::after{display:none}
.scan .line{position:absolute;left:14px;right:14px;height:2px;background:var(--y);box-shadow:0 0 14px var(--y);animation:scanl 1.3s var(--ease) infinite alternate;top:14px}
@keyframes scanl{to{top:calc(100% - 16px)}}
.scan .qr{position:absolute;inset:50px;width:calc(100% - 100px);height:calc(100% - 100px);opacity:.5}
.scan p{font-size:15px;text-align:center;line-height:1.5}
.scan p small{display:block;color:#aaa;font-size:13px}

/* ───────── End ───────── */
.endhero{padding:8px 24px 4px}
.endhero h2{font-size:25px;font-weight:800;line-height:1.3;letter-spacing:-.03em}
.endhero p{font-size:14.5px;color:var(--sub);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 16px 0;border-radius:16px;background:var(--bg2)}
.stats div{padding:14px 0;text-align:center}
.stats div+div{border-left:1px solid var(--line2)}
.stats b{display:block;font-size:20px;font-weight:800}
.stats small{font-size:12px;color:var(--sub)}
.block{margin:12px 16px 0;padding:16px;border-radius:18px;border:1px solid var(--line)}
.block h4{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.block h4>.pill,.block h4>small{margin-left:auto}
.ln-it{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:14px;border-top:1px solid var(--line)}
.ln-it:first-of-type{border-top:0;margin-top:6px}
.ln-it b{font-variant-numeric:tabular-nums}
.ln-it small{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px;border-radius:12px;overflow:hidden}
.photos i{aspect-ratio:1;display:block;position:relative}
.photos i.more::after{content:"+12";position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff;font-style:normal;font-weight:700;font-size:15px}
.keep .two button{height:48px}
.keep .res-bar{height:8px;border-radius:4px;background:var(--bg3);overflow:hidden;margin-top:14px}
.keep .res-bar i{display:block;height:100%;background:var(--ink);transition:width .6s var(--ease),background .3s}
.keep .res-bar i.ok{background:var(--ok)}
.keep .two button{display:flex;align-items:center;justify-content:center;gap:6px}
.keep .two button:disabled{opacity:.45}
.keep .two button.picked{opacity:1;box-shadow:0 0 0 2px var(--ink) inset}
.keep .res-bar i{animation:grow .7s var(--ease)}
@keyframes grow{from{width:0}}
.convert{margin-top:14px;padding:14px;border-radius:12px;background:var(--ok-soft);animation:fade .4s .7s both}
.cv-h{display:flex;gap:10px;align-items:center}
.cv-h b{display:block;font-size:14.5px}
.cv-h small{display:block;font-size:12px;color:var(--ok);font-weight:700;margin-top:2px}
.cv-ic{width:34px;height:34px;border-radius:10px;background:var(--ok);color:#fff;display:grid;place-items:center;flex:none}
.convert ul{margin:10px 0 12px;padding-left:18px;font-size:13px;color:var(--ink2);line-height:1.7}
.convert .btn{width:100%}
.pin .ic.grp{background:var(--ok-soft);color:var(--ok)}
.endhero .from{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.reco{display:flex;gap:10px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
.reco::-webkit-scrollbar{display:none}
.reco button{flex:none;width:212px;text-align:left;border-radius:16px;border:1px solid var(--line);padding:14px}
.reco .thumb{height:84px;border-radius:11px;margin-bottom:10px}
.reco b{font-size:14.5px;display:block;line-height:1.35}
.reco small{font-size:12px;color:var(--sub);display:block;margin-top:4px}

/* ───────── Partner center (PC) ───────── */
.pc{display:grid;grid-template-columns:220px 1fr;min-height:720px;background:#FAFAF8}
.pc-nav{border-right:1px solid var(--line);background:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:2px}
.pc-logo{display:flex;gap:9px;align-items:center;padding:4px 8px 18px;font-weight:800;font-size:15px}
.pc-logo i{width:26px;height:26px;border-radius:8px;background:var(--y);display:grid;place-items:center}
.pc-logo small{display:block;font-weight:500;font-size:11.5px;color:var(--sub)}
.pc-nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:14px;color:var(--ink2);text-decoration:none}
.pc-nav a.on{background:var(--bg2);color:var(--ink);font-weight:700}
.pc-main{padding:26px 32px 36px;min-width:0}
.crumb{font-size:12.5px;color:var(--sub)}
.pc-title{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 20px;gap:16px;flex-wrap:wrap}
.pc-title h2{font-size:24px;font-weight:800;letter-spacing:-.03em}
.pc-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
.panel+.panel{margin-top:16px}
.panel h3{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.panel h3 small{font-weight:500;font-size:12.5px;color:var(--sub)}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:7px}
.fld input{width:100%;height:42px;border-radius:10px;border:1px solid var(--line2);padding:0 12px;font-size:14.5px;outline:none;transition:border-color .15s}
.fld input:focus{border-color:var(--ink)}
.fld .help{font-size:12px;color:var(--sub);margin-top:6px}
.ptable{width:100%;border-collapse:collapse;font-size:13.5px}
.ptable th{font-size:12px;color:var(--sub);font-weight:600;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line)}
.ptable td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.ord{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--y);font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.shop{font-size:12px;white-space:nowrap}
.shop.y{color:var(--ok);font-weight:600}
.shop.n{color:var(--warn)}
.pc-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.pc-actions .btn{width:auto;padding:0 22px;height:46px;font-size:15px}
/* ───────── B2B partner web ───────── */
.device.desktop .crumb a{color:var(--sub);text-decoration:none}
.device.desktop .crumb a:hover{text-decoration:underline}
.device.desktop .pc-nav a .badge{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.device.desktop .side-col{position:sticky;top:16px}
.device.desktop .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.device.desktop .kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.device.desktop .kpi small{display:block;font-size:12.5px;color:var(--sub)}
.device.desktop .kpi b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px}
.device.desktop .kpi span{font-size:12px;color:var(--sub)}
.device.desktop .alert{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:14px;background:var(--warn-soft);font-size:14px;line-height:1.5;margin-bottom:10px}
.device.desktop .alert>svg{color:var(--warn);align-self:flex-start;margin-top:2px}
.device.desktop .alert.info{background:var(--blue-soft)}
.device.desktop .alert.info>svg{color:var(--blue)}
.device.desktop .alert .btn{margin-left:auto;flex:none;background:#fff}
.device.desktop .vbadge{display:inline-flex;align-items:center;gap:4px;color:var(--blue);font-weight:600}
.device.desktop .nlq{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--ink);border-radius:16px;padding:7px 7px 7px 16px}
.device.desktop .nlq input{flex:1;border:0;outline:none;font-size:16px;height:40px;min-width:0;background:none}
.device.desktop .qchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.device.desktop .qchip{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 5px 0 12px;border-radius:16px;font-size:13.5px;font-weight:600;background:var(--ink);color:#fff}
.device.desktop .qchip.f{background:var(--blue-soft);color:var(--blue)}
.device.desktop .qchip button{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;opacity:.7}
.device.desktop .qchip button:hover{opacity:1;background:rgba(127,127,127,.18)}
.device.desktop .qchip.add{background:#fff;color:var(--ink2);border:1px dashed var(--line2);padding:0 12px;cursor:pointer}
.device.desktop .qsugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.device.desktop .qsugg .chip{height:32px;font-size:13px}
.device.desktop .qlegend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:10px}
.device.desktop .qlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.device.desktop .lg-t{background:var(--ink)}.lg-f{background:var(--blue-soft);border:1px solid var(--blue)}
.device.desktop .qnote{font-size:13px;color:var(--sub);margin-top:8px;display:flex;gap:6px;align-items:center}
.device.desktop .qnote b{color:var(--ink)}
.device.desktop .qnote.warn,.device.desktop .qnote.warn b{color:var(--warn)}
.device.desktop .find-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start;margin-top:20px}
.device.desktop .find-side{position:sticky;top:16px}
.device.desktop .find-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px}
.device.desktop .tgl{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2);cursor:pointer}
.device.desktop .tgl input{accent-color:var(--ink);width:16px;height:16px}
.device.desktop .scard{display:grid;grid-template-columns:128px minmax(0,1fr);gap:16px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;transition:border-color .15s}
.device.desktop .scard.on{border-color:var(--ink)}
.device.desktop article.scard{cursor:pointer}
.device.desktop article.scard:hover{border-color:#E5484D}
.mpin.hot circle{fill:#E5484D;stroke:#E5484D}
.mpin.hot text{fill:#fff}
.device.desktop .sent{list-style:none;display:flex;flex-direction:column;gap:6px}
.device.desktop .sent li{display:flex;align-items:center;gap:8px;justify-content:space-between}
.device.desktop .sent li button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;font-size:14px;padding:6px 0}
.device.desktop .sent li button span{font-size:12px;color:var(--sub)}
.device.desktop .sent li button:hover b{text-decoration:underline}
.device.desktop .thumb{border-radius:12px;min-height:128px;position:relative;width:100%}
.device.desktop .thumb span{position:absolute;left:8px;top:8px;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--ink);font-size:12px;font-weight:800;display:grid;place-items:center}
.device.desktop .sc-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.device.desktop .sc-name{font-size:16.5px;font-weight:700;text-align:left}
.device.desktop .sc-name:hover{text-decoration:underline}
.device.desktop .tagrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.device.desktop .tg{font-size:12px;padding:3px 8px;border-radius:7px;background:var(--bg2);color:var(--ink2)}
.device.desktop .tg.hit{background:#FFF4B8;color:#6A5800;font-weight:700}
.device.desktop .tg.pop{background:var(--blue-soft);color:var(--blue)}
.device.desktop .tg small{font-size:9.5px;margin-left:4px;color:var(--blue);font-weight:700}
.device.desktop .why{display:flex;gap:6px;font-size:13px;color:var(--ink2);margin-top:8px;line-height:1.45}
.device.desktop .why svg{margin-top:2px;color:var(--sub)}
.device.desktop .iconbtn.sm{width:32px;height:32px}
.device.desktop .walk{font-size:13px;color:var(--sub);margin-top:10px;line-height:1.5}
.device.desktop .walk b{color:var(--ink)}
.device.desktop .empty-b{background:#fff;border:1px dashed var(--line2);border-radius:16px;padding:32px;text-align:center;font-size:13.5px;color:var(--sub);line-height:1.6}
.device.desktop .empty-b b{display:block;color:var(--ink);font-size:15px}
.device.desktop .photos{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;height:170px;margin-bottom:20px}
.device.desktop .photos span{border-radius:14px}
.device.desktop .photos.sm{height:90px;margin:0}
.device.desktop .kv{display:grid;grid-template-columns:130px 1fr;gap:10px 12px;font-size:14px}
.device.desktop .kv dt{color:var(--sub)}
.device.desktop .kv dd{margin:0}
.device.desktop .kv.sm{grid-template-columns:72px 1fr;font-size:13px;gap:6px 10px}
.device.desktop .kv .ok,.device.desktop .ok{color:var(--ok);font-weight:600;display:inline-flex;gap:4px;align-items:center}
.device.desktop .no{color:var(--mute)}
.device.desktop .tg-g{margin-bottom:14px}
.device.desktop .tg-g h4{font-size:12.5px;color:var(--sub);font-weight:600}
.device.desktop .tg-g .tagrow{margin-top:6px}
.device.desktop .evid{list-style:none;font-size:12.5px;color:var(--sub);margin-top:4px;line-height:1.7;border-top:1px solid var(--line);padding-top:10px}
.device.desktop .evid b{color:var(--ink2);font-weight:600}
.device.desktop .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.device.desktop .stats div{background:var(--bg2);border-radius:12px;padding:12px}
.device.desktop .stats small{font-size:12px;color:var(--sub);display:block}
.device.desktop .stats b{font-size:18px;font-weight:800;display:block;margin-top:4px;color:var(--ink)}
.device.desktop .stats b svg{color:var(--ok)}
.device.desktop .story{border-left:3px solid var(--ink);padding:2px 0 2px 12px;font-size:14px;line-height:1.55}
.device.desktop .story+.story{margin-top:12px}
.device.desktop .story small{display:block;color:var(--sub);font-size:12px}
.device.desktop .bdim{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:50;animation:fade .2s ease}
.device.desktop .bmodal{position:fixed;z-index:51;left:50%;top:24px;max-height:calc(100vh - 48px);overflow-y:auto;overscroll-behavior:contain;width:min(560px,calc(100vw - 32px));transform:translateX(-50%);background:#fff;border-radius:20px;padding:24px;box-shadow:var(--shadow-2);animation:bpop .22s var(--ease)}
.device.desktop .bmodal.lg{width:min(1000px,calc(100vw - 48px));background:#FAFAF8;padding:24px 28px 28px}
.bmodal .mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
.bmodal .mhead h3{font-size:24px}
.bmodal .pform{margin-top:16px}
.bmodal .pform .pc-actions{margin-top:8px}
.bmodal.lg>.pc-actions,.bmodal .pform .pc-actions{position:sticky;bottom:-28px;z-index:2;background:#FAFAF8;margin:16px -28px -28px;padding:14px 28px;border-top:1px solid var(--line)}
.bmodal .pform .pc-actions{background:#fff;margin:12px -20px -20px;padding:14px 20px;bottom:-28px}
.rreco{display:grid;grid-template-columns:26px minmax(0,1fr) 220px;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer;transition:border-color .15s}
.rreco:hover{border-color:var(--line2)}
.rreco.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.rck{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center}
.rreco.on .rck{background:var(--ink);border-color:var(--ink);color:var(--y)}
.rname{font-size:16.5px}
.rstops{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:13.5px}
.rstops li{display:flex;align-items:center;gap:6px}
.rreco .mapbox{margin:0;border-radius:12px;overflow:hidden}
.kbot{position:fixed;right:24px;bottom:24px;z-index:70;width:320px;background:#B2C7D9;border-radius:18px;padding:12px;box-shadow:var(--shadow-2);animation:bpop2 .3s var(--ease)}
.kbot-h{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px}
.kbot-h small{color:#4A5A68;font-size:11.5px}
.kbot-h .iconbtn{margin-left:auto}
.kbot-av{width:30px;height:30px;border-radius:11px;background:var(--y);display:grid;place-items:center}
.kbot-msg{background:#fff;border-radius:4px 14px 14px 14px;padding:12px 14px;font-size:13.5px;line-height:1.5;margin-left:38px}
.kbot-msg p{margin:4px 0 10px;color:var(--ink2)}
.kbot-msg .btn{width:100%}
@keyframes bpop2{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes bpop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translateX(-50%)}}
.bmodal h3{font-size:20px;font-weight:800;letter-spacing:-.02em}
.bmodal p.s{font-size:14px;color:var(--sub);margin:6px 0 18px;line-height:1.5}
.bmodal .pc-actions{margin-top:14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fld textarea,.fld select{width:100%;border-radius:10px;border:1px solid var(--line2);padding:10px 12px;font-size:14.5px;outline:none;background:#fff}
.fld select{height:42px;padding:0 10px}
.fld textarea{min-height:90px;resize:vertical;line-height:1.5}
.fld textarea:focus,.fld select:focus{border-color:var(--ink)}
.cbx{display:inline-flex;gap:6px;align-items:center;font-size:14px;padding:8px 12px;border:1px solid var(--line2);border-radius:10px;cursor:pointer;background:#fff}
.cbx input{accent-color:var(--ink);width:auto;height:auto}
.fld label.cbx{display:inline-flex;margin:0;font-weight:500;color:var(--ink)}
.feebox{background:var(--bg2);border-radius:12px;padding:12px 14px;font-size:14px}
.feebox small{display:block;font-size:12.5px;color:var(--sub);margin-top:4px;line-height:1.5}
.ferr{color:var(--warn);font-size:13px;margin-top:8px}
.ferr:empty{display:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{padding:10px 14px;font-size:14px;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);font-weight:700;border-color:var(--ink)}
.tabs button i{font-style:normal;font-size:11px;margin-left:4px;background:var(--warn);color:#fff;border-radius:9px;padding:1px 6px}
.prop{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.prop+.prop{margin-top:12px}
.prop-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.prop-h b{font-size:16px}
.terms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0 12px;font-size:13.5px}
.terms small{display:block;font-size:12px;color:var(--sub);margin-bottom:2px}
.terms .fld{margin:0}
.prop .msg{font-size:14px;color:var(--ink2);background:var(--bg2);border-radius:10px;padding:10px 12px;line-height:1.5}
.prop .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.tl{list-style:none}
.tl li{display:grid;grid-template-columns:52px 14px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
.tl li:first-child{border-top:0}
.tl time{font-weight:700}
.tl .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);margin-top:4px}
.tl li.done{color:var(--sub)}
.tl li.done .dot{background:var(--mute);border-color:var(--mute)}
.tl li.next .dot{background:var(--ink)}
.tl small{display:block;font-size:12.5px;color:var(--sub);margin-top:2px}
.capfld{margin:0;display:flex;align-items:center;gap:10px}
.capfld label{margin:0}
.capfld input{width:80px}
.calwrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:72px repeat(7,minmax(64px,1fr));gap:6px;font-size:13px;min-width:600px}
.cal .h{font-weight:700;text-align:center;padding:4px 0}
.cal .h button{font-size:11px;color:var(--sub);display:block;margin:2px auto 0;text-decoration:underline;font-weight:500}
.cal .h.off{color:var(--mute)}
.cal .sl{color:var(--sub);font-size:12.5px;align-self:center}
.cell{height:56px;border-radius:10px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-variant-numeric:tabular-nums;transition:border-color .15s}
.cell:hover{border-color:var(--ink2)}
.cell small{font-size:11px;color:var(--sub)}
.cell.busy{background:var(--blue-soft)}
.cell.full{background:var(--warn-soft)}
.cell.blk{background:var(--bg3);color:var(--mute)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--sub);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px}
.bars.tall{height:170px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--sub);height:100%;justify-content:flex-end}
.bars i{width:100%;max-width:44px;background:var(--ink);border-radius:6px 6px 2px 2px}
.bars b{font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.flow{display:grid;gap:8px;font-size:13.5px}
.flow div{background:var(--bg2);border-radius:12px;padding:10px 12px;line-height:1.5;display:flex;gap:10px}

.ipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}

const KAKAO_JS_KEY=window.KAKAO_JS_KEY||'';
let kakaoReady=null,kakaoFail=false;
const useKakao=()=>KAKAO_JS_KEY&&!kakaoFail;
function loadKakao(){
 return kakaoReady??=new Promise((ok,no)=>{const sc=document.createElement('script');
  sc.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(KAKAO_JS_KEY)}&autoload=false`;
  sc.onload=()=>window.kakao?.maps?kakao.maps.load(ok):no();sc.onerror=no;document.head.appendChild(sc)});
}
function drawKakaoMap(el,ids,done,me){
 loadKakao().then(()=>{
  if(!el.isConnected)return;
  const K=kakao.maps,ll=p=>new K.LatLng(p.lat,p.lng),pts=ids.map(P);
  const map=new K.Map(el,{center:ll(pts[0]),level:4});
  const b=new K.LatLngBounds();pts.forEach(p=>b.extend(ll(p)));map.setBounds(b,40,30,30,30);
  new K.Polyline({map,path:pts.map(ll),strokeWeight:4,strokeColor:'#191919',strokeOpacity:.35,strokeStyle:'shortdash'});

function rollNick(){
 const a=ADJ[Math.random()*ADJ.length|0],n=NOUN[Math.random()*NOUN.length|0];
 S.nick=`${a} ${n}`;
}
function orderPlaces(ids){ // 최근접 이웃: 가장 서쪽에서 출발
 if(ids.length<2)return ids.slice();
 const rest=ids.map(P);rest.sort((a,b)=>a.x-b.x);
 const out=[rest.shift()];
 while(rest.length){const l=out[out.length-1];let bi=0,bd=1e9;rest.forEach((p,i)=>{const d=Math.hypot(p.x-l.x,p.y-l.y);if(d<bd){bd=d;bi=i}});out.push(rest.splice(bi,1)[0])}
 return out.map(p=>p.id);
}
function walkMin(ids){let d=0;for(let i=1;i<ids.length;i++){const a=P(ids[i-1]),b=P(ids[i]);d+=Math.hypot(a.x-b.x,a.y-b.y)}return Math.round(d*0.09)} // 지도 단위→분
function durText(m){const h=Math.floor(m/60),mm=m%60;return (h?h+'시간 ':'')+(mm?mm+'분':'').trim()}
function avatarStyle(b){return `background:${grad(biasColor(b))}`}
function initial(nick){return nick.trim().split(' ').pop()[0]||nick[0]}

/* ═════════ Map SVG ═════════ */
function mapSVG(o={}){
 const W=360,H=250;
 const all=o.all?PLACES:[];
 const route=(o.route||[]).map(P);
 const done=o.done??-1;
 const path=route.map(p=>`${p.x},${p.y}`).join(' ');
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'루트 지도')}">${o.zoom?'<g class="mz">':''}
 <rect width="${W}" height="${H}" fill="var(--map)"/>
 <path d="M0 214 C 70 196,150 232,230 206 S 330 188,360 198 V${H} H0Z" fill="var(--river)"/>
 <text x="40" y="236" font-size="10" fill="#7FA3BE" font-weight="600">한강</text>
 <path d="M258 78 q44 -22 82 6 q14 44 -12 70 q-44 16 -76 -6 q-14 -38 6 -70z" fill="var(--park)"/>
 <text x="282" y="80" font-size="10" fill="#79A06A" font-weight="600">서울숲</text>
 <g stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"><path d="M0 116 H360"/><path d="M152 0 V200"/><path d="M0 34 L250 196"/><path d="M60 0 Q 90 90 40 200"/></g>
 <rect x="143" y="108" width="18" height="16" rx="4" fill="#fff" stroke="#9BB06B" stroke-width="2"/><text x="166" y="130" font-size="9.5" fill="#6E6E6E" font-weight="600">성수역</text>`;
 if(route.length>1){
  s+=`<polyline points="${path}" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>`;
  if(done>=0){
   const dpath=route.slice(0,done+1).map(p=>`${p.x},${p.y}`).join(' ');
   s+=`<polyline points="${path}" fill="none" stroke="var(--ink)" stroke-width="3" stroke-dasharray="1 7" stroke-linecap="round"/>`;
   if(done>0)s+=`<polyline points="${dpath}" fill="none" stroke="var(--ink)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  } else s+=`<polyline points="${path}" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
 }
 all.filter(p=>!o.route?.includes(p.id)).forEach(p=>{s+=`<g data-act="${o.pickable?'pick':''}" data-id="${p.id}" style="cursor:${o.pickable?'pointer':'default'}"><circle cx="${p.x}" cy="${p.y}" r="13" fill="transparent"/><circle cx="${p.x}" cy="${p.y}" r="6.5" fill="#fff" stroke="var(--ink)" stroke-width="2"/></g>`});
 route.forEach((p,i)=>{
  const isDone=done>=0&&i<done, isNext=done>=0&&i===done;
  const fill=isDone?'var(--ink)':(isNext?'var(--y)':'var(--ink)');
  const tc=isDone?'var(--y)':(isNext?'var(--ink)':'var(--y)');
  s+=`<g data-act="${o.pickable?'pick':''}" data-id="${p.id}" style="cursor:${o.pickable?'pointer':'default'}">${isNext?`<circle cx="${p.x}" cy="${p.y}" r="17" fill="var(--y)" opacity=".35"><animate attributeName="r" values="12;19;12" dur="2s" repeatCount="indefinite"/></circle>`:''}<circle cx="${p.x}" cy="${p.y}" r="11" fill="${fill}" stroke="#fff" stroke-width="2.5"/><text x="${p.x}" y="${p.y+4}" text-anchor="middle" font-size="11" font-weight="800" fill="${tc}">${isDone?'✓':i+1}</text></g>`;
  if(o.labels)s+=`<text x="${p.x}" y="${p.y-16}" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--ink)" stroke="var(--map)" stroke-width="3" paint-order="stroke">${esc(p.name.replace(/'/g,''))}</text>`;
 });
 if(o.line&&o.line.length>1)s+=`<polyline points="${o.line.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>`;
 (o.pins||[]).forEach(p=>{s+=`<g class="mpin" data-pin="${p.id||''}"><circle cx="${p.x}" cy="${p.y}" r="11" fill="${p.on?'var(--ink)':'#fff'}" stroke="var(--ink)" stroke-width="2"/><text x="${p.x}" y="${p.y+4}" text-anchor="middle" font-size="11" font-weight="700" fill="${p.on?'var(--y)':'var(--ink)'}">${p.n}</text></g>`});
 if(o.me){s+=`<circle cx="${o.me[0]}" cy="${o.me[1]}" r="14" fill="#2E62C9" opacity=".18"/><circle cx="${o.me[0]}" cy="${o.me[1]}" r="6" fill="#2E62C9" stroke="#fff" stroke-width="2.5"/>`}
 return s+(o.zoom?'</g>':'')+'</svg>';
}

  if(s.left>0&&s.d>=WEEK[0]&&s.d<=WEEK[1]&&!mine)out.push({r,s});
 }));

function recommendFrom(id,n=4){
 const out=[id],rest=PLACES.filter(p=>p.id!==id);
 while(out.length<n&&rest.length){const l=P(out[out.length-1]);let bi=0,bd=1e9;rest.forEach((p,i)=>{const d=Math.hypot(p.x-l.x,p.y-l.y);if(d<bd){bd=d;bi=i}});out.push(rest.splice(bi,1)[0].id)}
 return out;
}
function bestOrder(ids){
 if(ids.length<3)return ids;
 const [s,...rest]=ids,len=o=>o.reduce((d,id,i)=>i?d+Math.hypot(P(o[i-1]).x-P(id).x,P(o[i-1]).y-P(id).y):0,0);
 let best=ids,bd=len(ids);
 const perm=(arr,acc)=>{if(!arr.length){const o=[s,...acc],d=len(o);if(d<bd){bd=d;best=o}return}arr.forEach((x,i)=>perm(arr.filter((_,j)=>j!==i),[...acc,x]))};
 perm(rest,[]);return best;
}

  ${calendarHTML({dates:[...new Set(cand.map(p=>p.d))],sel:S.fdate,act:'fdate',note:'점 = 겹치는 파티가 있는 날'})}
  ${S.fdate?`<div class="times"><div class="slbl">${sDate(S.fdate)} · 시간 선택</div><div class="schips">${times.map(t=>`<button class="schip ${S.ftime===t?'on':''}" data-act="ftime" data-t="${t}"><b class="num">${t}</b><span class="l num">· 파티 ${cand.filter(p=>p.d===S.fdate&&p.time===t).length}개</span></button>`).join('')}</div></div>`:''}
  <div class="sec-h"><h2>겹치는 파티</h2><small>2곳 이상 겹침</small></div>
  ${list.length?list.map(p=>partyCard(p,ord)).join('')
   :`<div class="empty" style="padding:20px 28px">${!cand.length?'<b>겹치는 파티가 아직 없어요</b>내 루트로 새 파티를 열면, 비슷한 루트를 짜는 팬에게 추천돼요.':!S.fdate?'달력에서 날짜를 먼저 골라 주세요.':'시간을 고르면 겹치는 파티가 보여요.'}</div>`}
  <button class="newparty" data-act="newParty"><span class="pl">${ic('plus',20,2.2)}</span><span><b>내 루트로 새 파티 열기</b><small>최소 3명이 모이면 확정돼요. 마감(전날 22:00)까지 모자라면 자동으로 해산하고 알려 드려요.</small></span></button>

 </section>`;
}

/* 3. 입장 */
function scrEntry(){
 const c=S.ctx, n=c.count, st=need(n);
 const fixed=c.kind==='fixed', r=fixed&&R(c.rid), s=fixed&&c.sid&&r.sessions.find(x=>x.id===c.sid);
 const b=S.bias;
 const all=S.agree.every(Boolean), ready=!fixed||!!s;
 const rules=[['만남은 루트 속 공개 장소에서만','개인 숙소·차량 이동 제안은 금지예요'],['정산은 카카오페이로만','개인 계좌이체를 요청하면 신고할 수 있어요'],['불편하면 신고, 즉시 분리','신고하면 바로 다른 방으로 옮겨 드려요']];
 return `<section class="scr">
 ${hd('',{back:true,close:true})}
 <div class="bd">
  <div class="entry-h"><h2>동행방에 들어가요</h2><p class="num">${esc(c.title)}${c.when?` · ${c.when}`:''}</p></div>
  ${fixed?`<div class="sec-h" style="padding-top:22px"><h2>언제 갈까요?</h2><small>날짜 → 시간</small></div>
  ${calendarHTML({dates:[...new Set(r.sessions.map(x=>x.d))],sel:S.edate,act:'edate'})}
  ${S.edate?`<div class="times"><div class="slbl">${sDate(S.edate)} · 시간 선택</div><div class="schips">${r.sessions.filter(x=>x.d===S.edate).map(x=>`<button class="schip ${c.sid===x.id?'on':''}" data-act="etime" data-s="${x.id}" ${x.left===0?'disabled':''}><b class="num">${x.time}</b><span class="l num ${x.left===1?'w':''}">· ${x.left===0?'마감':x.left+'자리'}</span></button>`).join('')}</div></div>`:''}`:''}
  <div class="nick"><span class="av" style="${avatarStyle(b)}">${esc(initial(S.nick))}</span><span><small>닉네임</small><b id="nk">${esc(S.nick)}</b></span><button class="iconbtn" data-act="reroll" aria-label="닉네임 다시 뽑기">${ic('refresh',20)}</button></div>
  <div class="rules"><h4>방 규칙 <button data-act="agreeAll">${all?'모두 해제':'모두 동의'}</button></h4>
   ${rules.map((r,i)=>`<button class="rule ${S.agree[i]?'on':''}" data-act="agree" data-i="${i}" role="checkbox" aria-checked="${S.agree[i]}"><span class="ck">${S.agree[i]?ic('check',14,3):''}</span><span>${r[0]}<small>${r[1]}</small></span></button>`).join('')}
  </div>
  <div class="rules" style="margin-top:18px"><h4>선택 동의</h4>
   <div class="rule-wrap"><button class="rule ${S.payLink?'on':''}" data-act="payLink" role="checkbox" aria-checked="${S.payLink}"><span class="ck">${S.payLink?ic('check',14,3):''}</span><span>카카오페이 결제를 루트 기록에 연결</span></button><button class="iconbtn" data-act="sheet" data-s="payInfo" aria-label="자세히 보기">${ic('chev',20)}</button></div>
  </div>
  ${ready?`<div class="headcount ${st.ok?'ok':''}"><div class="dots ${st.ok?'ok':''}">${[0,1,2,3,4].map(i=>`<i class="${i<n?'f':''}"></i>`).join('')}</div><span class="num ${st.ok?'okt':'needt'}">${st.t}</span></div>`:''}
  <div style="height:24px"></div>
 </div>
 <div class="ft"><button class="btn" data-act="enterAsk" ${ready&&all?'':'disabled'}>${!ready?'날짜와 시간을 골라 주세요':all?'동의하고 입장':'방 규칙 동의 필요'}</button></div>
 </section>`;
}

/* 4. 동행방 */
function statusLabel(r){
 if(r.status==='recruiting')return `<span class="pill neutral num">모집 중 ${r.members.length}/5</span>`;
 if(r.status==='in_progress')return `<span class="pill ink num">진행 중 · ${S.live.stamps}/5곳</span>`;
 return `<span class="pill ok num">확정 ${r.members.length}/5</span>`;
}
function scrRoom(){
 const r=S.room;
 let last=null;
 const msgs=r.msgs.map(m=>{const h=msgHTML(m,last);last=m.from;return h}).join('')+(r.typing?`<div class="m k typing"><span class="av k">하</span><div class="col"><div class="ln"><div class="bub"><i></i><i></i><i></i></div></div></div></div>`:'');
 return `<section class="scr chat">
 ${hd(`${esc(r.short)}<small class="num">${r.members.length}</small>`,{back:true,right:`<button class="iconbtn" aria-label="검색">${ic('search',22)}</button><button class="iconbtn" aria-label="메뉴" data-act="toast" data-msg="방 정보 · 신고 · 나가기 (목업)">${ic('dots',22)}</button>`})}
 ${r.group?`<div class="pin"><span class="ic grp">${ic('users',18,2)}</span><span class="t"><b>일반 그룹채팅</b><small class="num">${r.when.split(' ')[0]} 루트 함께 완주</small></span><span class="pill neutral">루트 종료</span></div>`
 :`<div class="pin"><span class="ic">${ic('route',18,2)}</span><span class="t"><b class="num">${r.when} ${esc(r.title)}</b><small>${r.status==='recruiting'?`${3-r.members.length>0?3-r.members.length+'명 더 오면 확정':'확정'} · 출발 ${r.start}`:`출발 ${r.start}`}</small></span>${statusLabel(r)}</div>`}
 <div class="bd" id="chatbd">${msgs}</div>
 ${r.group?'':`<div class="suggest">${['@하나 다음 장소 어디야?','@하나 포토부스 8000원 정산','@하나 내일 날씨'].map(t=>`<button data-act="suggest" data-t="${esc(t)}">${esc(t)}</button>`).join('')}${r.status!=='recruiting'?`<button data-act="go" data-to="live">당일 진행 화면 →</button>`:''}</div>`}
 <div class="inbar">${r.group?`<button class="iconbtn" data-act="toast" data-msg="사진 · 파일 보내기 (목업)" aria-label="첨부">${ic('plus',22)}</button>`:`<button class="iconbtn" data-act="mapSheet" aria-label="현재 루트 지도">${ic('map',22)}</button>`}
  <label class="field"><input id="msg" placeholder="메시지 입력" value="${esc(S.draft)}" autocomplete="off">${r.group?'':'<button class="atk" data-act="atk">@하나</button>'}</label>
  <button class="send" data-act="send" aria-label="보내기" ${S.draft.trim()?'':'disabled'}>${ic('send',20,2.4)}</button></div>
 </section>`;
}
function msgHTML(m,lastFrom){
 if(m.t==='sys')return `<div class="m-sys"><span>${m.text}</span></div>`;
 if(m.t==='date')return `<div class="m-sys m-date"><span>${m.text}</span></div>`;
 const me=m.from==='me', k=m.from==='kanana';
 const cont=lastFrom===m.from;
 let body='';
 if(m.t==='text')body=`<div class="bub">${m.html||esc(m.text)}</div>`;
 if(m.t==='settle')body=settleCard(m);
 if(m.t==='dcheck')body=dcheckCard(m);
 const wide=m.t!=='text'?' wide':'';
 if(me)return `<div class="m me${wide}"><div class="col"><div class="ln">${body}<span class="tm">${m.time||''}</span></div></div></div>`;
 const who=k?null:S.room.members.find(x=>x.nick===m.from);
 const av=k?`<span class="av k">하</span>`:`<span class="av" style="${avatarStyle(who?.bias)}">${esc(initial(m.from))}</span>`;
 return `<div class="m ${k?'k':''}${wide}">${cont?'<span class="av ghost"></span>':av}<div class="col">${cont?'':`<span class="nm ${k?'k':''}">${k?'하나<small>루트 도우미</small>':esc(m.from)}</span>`}<div class="ln">${body}<span class="tm">${m.time||''}</span></div></div></div>`;
}
function settleCard(m){
 const s=m.s, on=s.targets.filter(t=>t.on), per=Math.round(s.amount/(on.length+1)/10)*10;
 const paid=on.filter(t=>t.paid).length;
 const btn=s.status==='draft'
  ?`<button class="paybtn" data-act="settleReq" data-id="${m.id}" ${on.length?'':'disabled'}><span class="pay">pay</span>카카오페이로 정산 요청</button>`
  :`<div class="applied" style="margin:10px 0 0">${paid===on.length?ic('check',14,3)+'정산 완료':`요청 보냄 · <span class="num">${paid}/${on.length}명 완료</span>`}</div>`;
 return `<div class="card"><div class="card-h">${ic('wallet',14,2.2)}정산 · 1/N</div>
 <div class="card-b"><div style="font-size:14px;font-weight:600">${esc(s.title)}</div><div class="amt num">${won(s.amount)}원<small>1인 ${won(per)}원</small></div>
 <div class="tgt"><button disabled style="cursor:default"><span class="ck" style="background:var(--y);border-color:var(--y)">${ic('check',12,3)}</span>나 (결제함)<span class="st">${won(per)}원</span></button>
 ${s.targets.map((t,i)=>`<button class="${t.on?'on':''}" data-act="settleT" data-id="${m.id}" data-i="${i}" ${s.status!=='draft'?'disabled':''}><span class="ck">${t.on?ic('check',12,3):''}</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.nick)}</span><span class="st ${t.paid?'paid':''}">${!t.on?'제외':t.paid?'완료':won(per)+'원'}</span></button>`).join('')}</div>
 ${btn}</div></div>`;
}
function dcheckCard(m){
 const d=m.d, total=S.room.members.length;
 return `<div class="card"><div class="card-h">${ic('calendar',14,2.2)}D-1 참석 확인</div><div class="card-q">내일 13:00, 오실 수 있나요?</div>
 <div class="card-b">${d.mine==null?`<div class="two"><button data-act="dcheck" data-id="${m.id}" data-v="0">못 가요</button><button class="y" data-act="dcheck" data-id="${m.id}" data-v="1">참석할게요</button></div>`
  :`<div class="applied" style="margin:0;${d.mine?'':'background:var(--bg3);color:var(--sub)'}">${d.mine?ic('check',14,3)+'참석 확인 완료':'불참 처리 · 자리가 다음 대기자에게 넘어가요'}</div>`}</div>
 <div class="card-f"><span class="num">${d.ok}/${total}명 확인 · 미확인 시 내일 09:00 자리 해제</span></div></div>`;
}

function pzPiece(x,y,w,h,t={}){
 const r=14,arc=(d,ex,ey)=>`A${r} ${r} 0 0 ${d>0?1:0} ${ex} ${ey}`;
 let p=`M${x} ${y}`;
 if(t.t)p+=`L${t.t[0]-r} ${y}${arc(t.t[1],t.t[0]+r,y)}`; p+=`L${x+w} ${y}`;
 if(t.r)p+=`L${x+w} ${t.r[0]-r}${arc(t.r[1],x+w,t.r[0]+r)}`; p+=`L${x+w} ${y+h}`;
 if(t.b)p+=`L${t.b[0]+r} ${y+h}${arc(t.b[1],t.b[0]-r,y+h)}`; p+=`L${x} ${y+h}`;
 if(t.l)p+=`L${x} ${t.l[0]+r}${arc(t.l[1],x,t.l[0]-r)}`;
 return p+'Z';
}

function qrSVG(seed=7){
 let s=seed;const rnd=()=>(s=(s*9301+49297)%233280)/233280;
 const inF=(x,y)=>(x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12);
 const f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
 let r='';for(let y=0;y<21;y++)for(let x=0;x<21;x++)if(!inF(x,y)&&rnd()>.5)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
 return `<svg viewBox="-1 -1 23 23" shape-rendering="crispEdges" aria-hidden="true"><rect x="-1" y="-1" width="23" height="23" fill="#fff"/><g fill="#191919">${r}${f(0,0)}${f(14,0)}${f(0,14)}</g></svg>`;
}

function push(m){m.id=++msgId;S.room.msgs.push(m);}
function now(){const t=[...(S.room?.msgs||[])].reverse().find(m=>m.time);return t?t.time:'오후 2:20'}
function kananaSay(text,delay=800,after){
 S.room.typing=true; if(S.screen==='room')render();
 setTimeout(()=>{S.room.typing=false;push({t:'text',from:'kanana',time:now(),text});if(after)after();if(S.screen==='room')render()},delay);
}
/* 하나 AI: hana/server.py 로 띄웠을 때만 동작. 서버가 질문셋(hana/questions.json)으로 의도를 고르고
   아래 사실(facts)만 근거로 답함. 실패하면 fallback(대사집) 문장 */
function hanaFacts(){
 const r=S.room, ids=r.route, i=Math.min(S.live.stamps,ids.length-1), p=P(ids[i]), n=r.members.length;
 return {
  weather:'내일 성수 낮 14도, 15시 전후 비 확률 60%',
  next_place:`${i+1}번째 장소 ${p.name} — ${p.story}`,
  start:`${r.start} (${r.when})`,
  schedule:`${r.when} 출발 · 장소 ${ids.length}곳`,
  members:`지금 ${n}명 / 최대 5명. ${n>=3?'확정됨':`${3-n}명 더 오면 확정. 일요일 09:00까지 3명이 안 되면 방 해산, 알림 감`}`,
  route:ids.map((id,k)=>`${k+1}. ${P(id).name}`).join(', '),
  settle_help:'"@하나 포토부스 8000원 정산"처럼 금액과 같이 부르면 1/N 정산 카드를 만들어 줌. 카카오페이로만 정산, 수수료 없음',
  help:'다음 장소, 날씨, 만나는 곳, 일정, 인원, 루트 목록, 정산 방법을 물어보면 답해 줌'
 };
}
function hanaFallback(t){
 if(/정산/.test(t))return '금액도 같이 알려 주세요.\n예: @하나 포토부스 8000원 정산';
 if(/날씨|비|우산/.test(t))return '내일 성수 날씨 14도, 15시 전후 비 확률 60%\n리마인, 우산 꼭 챙겨야 하는 거 알제?';
 if(/다음|어디|장소/.test(t)){const ids=S.room.route,i=Math.min(S.live.stamps,ids.length-1),p=P(ids[i]);return /레코드숍/.test(p.name)?'다음은 레코드숍! 니 기억 안 나나? 팬싸한 곳 아이가. LP코너에 싸인 있으니까 꼭~ 함 봐라!':`다음은 ${i+1}번 ${p.name}이에요.\n${p.story}`}
 return '어… 그건 뭔 말인지 잘 모르겠다 ㅎㅎ\n다음 장소나 날씨 같은 거 물어봐 주면 바로 알려줄게~';
}
function hanaAI(kind,text,fallback){
 const r=S.room, me=r.members.find(x=>x.me);
 r.typing=true; if(S.screen==='room')render();
 const body={kind,text,me:me?.nick,facts:hanaFacts(),room:{title:r.title,status:r.status,members:r.members.map(x=>x.nick)},
  msgs:r.msgs.filter(m=>m.t==='text').slice(-10).map(m=>({from:m.from==='kanana'?'하나':m.from==='me'?me?.nick:m.from,text:m.text}))};
 const ac=new AbortController(); setTimeout(()=>ac.abort(),15000);
 fetch('/api/hana',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ac.signal})
  .then(x=>x.ok?x.json():Promise.reject()).then(d=>{console.log('하나 의도:',d.intent);return d.text||Promise.reject()})
  .catch(()=>new Promise(res=>setTimeout(()=>res(fallback),800)))
  .then(t=>{r.typing=false;push({t:'text',from:'kanana',time:now(),text:t});if(S.screen==='room')render()});
}
function parseAmount(t){
 const m=t.match(/(\d[\d,]*(?:\.\d+)?)\s*(만\s*원|만|천\s*원|천|원)?/); if(!m)return 0;
 let n=parseFloat(m[1].replace(/,/g,'')); const u=(m[2]||'').replace(/\s/g,'');
 if(u.startsWith('만'))n*=10000; else if(u.startsWith('천'))n*=1000; return Math.round(n);
}
function handleSend(){
 const text=S.draft.trim(); if(!text)return;
 S.draft=''; push({t:'text',from:'me',time:now(),text});
 if(S.room.group){if(/@하나/.test(text))push({t:'sys',text:'하나는 이 방을 나갔어요. 새 루트 동행방에서 불러 주세요.'});return}
 if(/@하나/.test(text)){
  const t=text.replace(/@하나/g,'').trim();
  const amt=parseAmount(t), n=S.room.members.length;
  if(/정산/.test(t)&&amt){
   const title=t.replace(/(\d[\d,]*(?:\.\d+)?)\s*(만\s*원|만|천\s*원|천|원)?/,'').replace(/정산(해\s*줘|해줘|요청)?/,'').trim()||'공동 지출';
   if(n<2){kananaSay('지금은 방에 나 혼자예요. 멤버가 들어오면 정산할 수 있어요.');}
   else kananaSay(`${n}명이 ${won(Math.round(amt/n/10)*10)}원씩 정산할까요?\n대상에서 뺄 사람이 있으면 체크를 풀어 주세요.`,900,()=>{
    push({t:'settle',from:'kanana',time:now(),s:{title,amount:amt,status:'draft',targets:S.room.members.filter(x=>!x.me).map(x=>({nick:x.nick,on:true,paid:false}))}});
   });
  } else hanaAI('chat',t,hanaFallback(t));
 } else {
  if(!S.reacted){S.reacted=true;hanaAI('react',text,'오 진짜가? 반갑다 리마인~\n다른 분들은 우째 입덕했노?')}
  if(S.greeted||S.room.members.length<2)return;
  S.greeted=true; const o=S.room.members.find(x=>!x.me);
  setTimeout(()=>{push({t:'text',from:o.nick,time:now(),text:'반가워요!! 내일 응원봉 들고 갈게요 ㅎㅎ'});if(S.screen==='room')render()},1400);
 }
}
