function curKey(){
 switch(S.screen){
  case 'home':return 'home';
  case 'artist':return S.tab==='free'?'free':'artist';
  case 'room':return S.roomKey;
  default:return S.screen;
 }
}
function jump(key){
 S.sheet=null;S.prev=[];S.dir=1;
 switch(key){
  case 'more':S.screen='more';break;
  case 'onboard':S.onboarded=false;S.homeState='new';S.followed={};S.cats=[];S.ob={step:1,q:''};S.bias=null;S.member='all';S.prev=['more'];S.screen='onboard';break;
  case 'home':S.onboarded=true;S.homeState='followed';S.followed={lumin:true,aurora:true,moonmart:true};if(!S.cats.length)S.cats=['idol','webtoon'];if(!S.cats.includes(S.homeCat))S.homeCat=S.cats[0];S.wpage=0;S.bias=S.bias||'hana';S.prev=['more'];S.screen='home';break;
  case 'artist':S.artist='lumin';S.tab='fixed';S.followed.lumin=true;S.bias=S.bias||'hana';S.member='all';S.open=null;S.pick={};S.prev=['home'];S.screen='artist';break;
  case 'free':S.artist='lumin';S.tab='free';S.picked=[];S.prev=['home'];S.screen='artist';break;
  case 'freeParty':S.artist='lumin';S.tab='free';if(S.picked.length<3)S.picked=['p1','p7','p2','p6','p5'];S.fdate='2026-11-07';S.ftime='14:00';S.fsel=null;S.ovOpen=null;S.routeOpen=false;S.prev=['home','artist'];S.screen='freeParty';break;
  case 'entry':S.bias=S.bias||'hana';ctxFixed('r1','b');rollNick();S.agree=[false,false,false];S.prev=['home','artist'];S.screen='entry';break;
  case 'room-recruit':case 'room-vote':case 'room-settle':presetRoom(key.split('-')[1]);S.prev=['home'];S.screen='room';break;
  case 'live':S.live={stamps:2,scanning:false,line:null,pop:-1};S.prev=['home','room'];if(!S.room)presetRoom('vote');S.screen='live';break;
  case 'end':S.keep=null;S.prev=['home'];S.screen='end';break;
  default:S.screen=key;S.b.modal=null;S.b.editing=null;S.b.bot=null;S.b.rt.view='list';S.b.ipq={text:'',cat:'all',open:false};
 }
 render(true);
}
function ctxFixed(rid,sid){
 const r=R(rid),s=r.sessions.find(x=>x.id===sid);
 S.edate=s?s.d:null;
 S.ctx={kind:'fixed',rid,sid:s?.id||null,title:r.name,short:r.short,when:s?sWhen(s):'',area:r.area,dur:r.dur,count:s?Math.min(4,5-s.left):0,route:r.places.length?r.places:R('r1').places};
}
function renderNav(){
 const k=curKey(); let n=0;
 document.getElementById('nav').innerHTML=INDEX.map(g=>`<div class="nav-g"><h4>${g.g}</h4>${g.items.map(([id,label,tag])=>{n++;return `<button class="nav-i ${k===id?'on':''}" data-nav="${id}" aria-current="${k===id}"><span class="n">${String(n).padStart(2,'0')}</span>${label}${tag?`<span class="tag">${tag}</span>`:''}</button>`}).join('')}</div>`).join('');
 n=0;
 document.getElementById('mnav').innerHTML=INDEX.map(g=>`<optgroup label="${g.g}">${g.items.map(([id,label])=>{n++;return `<option value="${id}" ${k===id?'selected':''}>${String(n).padStart(2,'0')} ${label}</option>`}).join('')}</optgroup>`).join('');
 const notes=NOTES[k]||[];
 document.getElementById('notes').innerHTML=`<h5>이 화면 메모</h5><ul>${notes.map(t=>`<li>${t}</li>`).join('')}</ul>`;
}

function go(to){S.prev.push(S.screen);S.dir=1;S.sheet=null;S.screen=to;if(to==='home'&&!S.prev.includes('more'))S.prev=['more'];render(true)}

function parseQuery(text){
 const chips=[],used=[];
 const add=(k,v,w)=>{used.push(w);if(!chips.some(c=>c.k===k&&c.v===v))chips.push({k,v})};
 for(const [k,list] of Object.entries(VOCAB))list.forEach(v=>{if(text.includes(v))add(k,v,v)});
 for(const [w,[k,v]] of Object.entries(ALIAS))if(text.includes(w))add(k,v,w);
 AREAS.forEach(a=>{if(text.includes(a))add('지역',a,a)});
 const m=text.match(/(\d+)\s*명/);if(m)add('수용',+m[1],m[0]);
 const vw=chips.filter(c=>c.k==='분위기').map(c=>c.v);
 const vibe=vw.length?vw.join(' ')+(text.includes('감성')?' 감성':''):'';
 const STOP=new Set(['그런','수','곳','좀','같은','쪽','위주','그리고','하고','정도','근처','느낌','있는','받을','곳이요','곳으로']);
 const left=text.split(/[\s,.!?]+/).filter(t=>t&&!used.some(u=>t.includes(u)))
  .map(t=>t.length>2?t.replace(/(이라서|이라|라서|이|가|은|는|을|를|에|로)$/,''):t)
  .filter(t=>!STOP.has(t)&&!/^(감성|느낌|근처|정도)/.test(t));
 return {chips,vibe,left};
}

   return {s,hit,score:hit.length*10+sim}})
  .sort((a,b)=>b.score-a.score);
}

/* 협업함 (양쪽 공용) · 종료·거절은 목록에 남기지 않고 카카오톡 챗봇으로 알려요 */
let botTimer;
function botDemo(side){ // 데모: 협업함에 들어오고 3초 뒤, 보낸 제안 1건이 상대에게 거절됨
 if(S.b.botShown[side]||botTimer)return;
 botTimer=setTimeout(()=>{botTimer=null;
  const p=S.b.props.find(x=>x.side===side&&x.dir==='out'&&x.status==='wait');
  if(S.screen!==(side==='ip'?'b-ipinbox':'b-inbox')||!p)return;
  S.b.botShown[side]=true;p.status='declined';S.b.bot={side,who:p.who};render()},3000);
}
const iga=w=>{const c=w.replace(/[^가-힣]/g,'').slice(-1).charCodeAt(0)-0xAC00;return c>=0&&c%28?'이':'가'};
function botCard(role){
 const b=S.b.bot;if(!b||b.side!==role)return '';
 const ip=role==='ip';
 return `<aside class="kbot" role="status" aria-label="카카오톡 챗봇 알림"><div class="kbot-h"><span class="kbot-av">${ic('route',16,2.2)}</span><b>카카오루트 파트너</b><small>카카오톡 · 방금</small><button class="iconbtn sm" data-act="kbotx" aria-label="알림 닫기">${ic('close',16,2.2)}</button></div>
  <div class="kbot-msg"><b>[협업 ${ip?'제안':'신청'} 결과]</b><p>${esc(b.who)}${iga(b.who)} ${ip?'LUMIN의 협업 제안을':'팝업 협업 신청을'} 거절했어요. 거절한 건은 협업함에 남지 않아요.</p>
   <button class="btn line sm" data-act="pcgo" data-to="${ip?'b-find':'b-ipfind'}">${ip?'다른 공간 찾아보기':'다른 IP 찾아보기'}</button></div></aside>`;
}
function propCard(p){
 const who=p.side==='ip'?`<button class="sc-name" data-act="bopen" data-id="${p.space}">${esc(p.who)}</button>`:`<b>${esc(p.who)}</b>`;
 const pill={wait:p.dir==='in'?'<span class="pill warn">답변 필요</span>':'<span class="pill neutral">상대 응답 대기</span>',countered:'<span class="pill neutral">수정 제안 보냄 · 응답 대기</span>',active:'<span class="pill ok">진행 중</span>'}[p.status];
 const ed=S.b.editing===p.id;
 const terms=ed?`<div class="terms">
   <div class="fld"><label for="ce-to">종료일</label><input id="ce-to" type="date" value="${p.to}" min="${p.from}"></div>
   <div class="fld"><label for="ce-cap">회차당 인원</label><input id="ce-cap" type="number" min="1" value="${p.cap}"></div>
   <div class="fld" style="grid-column:span 2"><label for="ce-menu">한정 메뉴</label><input id="ce-menu" value="${esc(p.menu)}"></div></div>`
  :`<div class="terms"><div><small>기간</small><span class="num">${fmtD(p.from)} – ${fmtD(p.to)}</span>${p.popup?' <span class="pill branch">팝업</span>':''}</div><div><small>회차당 인원</small><span class="num">${p.cap}명</span></div><div><small>한정 메뉴</small>${esc(p.menu)}</div><div><small>수수료</small>측정 결제의 ${FEE*100}%</div></div>`;
 const acts=ed?`<button class="btn line sm" data-act="bcancel">취소</button><button class="btn dark sm" data-act="bcsend" data-id="${p.id}">수정 제안 보내기</button>`
  :p.dir==='in'&&p.status==='wait'?`<button class="btn line sm" data-act="bdec" data-id="${p.id}">거절</button><button class="btn line sm" data-act="bcounter" data-id="${p.id}">조건 수정</button><button class="btn dark sm" data-act="bacc" data-id="${p.id}">수락</button>`:'';
 return `<article class="prop"><div class="prop-h"><div>${who}<div class="tagrow">${p.ops.map(o=>`<span class="tg">${esc(o)}</span>`).join('')}</div></div>${pill}</div>${terms}${p.msg?`<p class="msg">${esc(p.msg)}</p>`:''}${acts?`<div class="acts">${acts}</div>`:''}<p class="ferr" id="ferr-${p.id}" role="alert"></p></article>`;
}
function inboxHTML(side){
 const all=S.b.props.filter(p=>p.side===side),t=S.b.tab[side];
 const groups={in:all.filter(p=>p.dir==='in'&&['wait','countered'].includes(p.status)),out:all.filter(p=>p.dir==='out'&&['wait','countered'].includes(p.status)),active:all.filter(p=>p.status==='active')};

}

// ponytail: 목업 추천기. 라벨(앨범·멤버·장면)로 장소를 묶고 페르소나 키워드로 점수만 더함. 실제는 IP 페르소나를 넣은 추천 API로 교체
function recoRoutes(persona){
 const ps=S.b.places.filter(p=>p.label&&P(p.id)?.x!=null&&!S.b.rt.off.includes(p.id));
 const short=/짧|1시간|2시간|가볍/.test(persona),photo=/사진|포토|인증샷/.test(persona),newbie=/입덕|처음|초보|입문/.test(persona);
 const cands=[
  ...ALBUMS.map(a=>({name:`${a} 앨범 순서 루트`,kind:'album',ids:ps.filter(p=>p.label.albums.includes(a)).map(p=>p.id),why:`${a} 라벨이 붙은 장소를 동선 순서로 이었어요`})),
  ...A('lumin').members.map(m=>({name:`${m.name}의 갈림길`,kind:'branch',tags:[m.id],ids:ps.filter(p=>p.label.members.includes(m.id)).map(p=>p.id),why:`${m.name} 라벨이 붙은 장소만 따라가요`})),
  ...SCENES.map(s=>({name:`${s} 따라 걷기`,kind:'album',ids:ps.filter(p=>p.label.scenes.includes(s)).map(p=>p.id),why:`'${s}' 장면이 있는 장소를 모았어요`})),
 ].filter(c=>c.ids.length>=2);
 const seen=new Set(),out=[];
 cands.map(c=>{
  let ids=orderPlaces(c.ids);if(short)ids=ids.slice(0,3);
  const sc=S.b.places.filter(p=>ids.includes(p.id));
  const keys=[short&&'짧은 코스',photo&&sc.some(p=>p.label.scenes.some(s=>s==='뮤비 촬영지'||s==='재킷 촬영'))&&'포토 스폿',newbie&&c.kind==='album'&&'입덕 팬용 대표 장소'].filter(Boolean);
  return {...c,ids,keys,score:ids.length+keys.length*2};
 }).sort((a,b)=>b.score-a.score).forEach(c=>{const k=[...c.ids].sort().join();if(!seen.has(k)&&out.length<4){seen.add(k);out.push(c)}});
 return out.map((c,i)=>{const w=walkMin(c.ids);return {id:'rc'+i,name:c.name,kind:c.kind,places:c.ids,tags:c.tags||[...new Set(S.b.places.filter(p=>c.ids.includes(p.id)).flatMap(p=>p.label.members))],
  why:c.why+(c.keys.length?` · 페르소나 반영: ${c.keys.join(', ')}`:''),walk:w,dur:durText(c.ids.length*30+w),area:'성수',sessions:[]}});
}

 baddopen:()=>{S.b.addOpen=!S.b.addOpen;render()},
 badd:d=>{S.b.q.chips.push({k:d.k,v:d.k==='수용'?+d.v:d.v});render()},
 bopen:d=>{S.b.modal={t:'space',id:d.id,form:false};render();document.querySelector('.bmodal .mx')?.focus()},
 bpropose:()=>{S.b.modal.form=true;render();document.getElementById('mf-from')?.focus()},
 bapply:d=>{S.b.modal={t:'apply',id:d.id};render();document.getElementById('mf-from')?.focus()},
 bstory:d=>{S.b.modal={t:'story',id:d.id};render();document.getElementById('mf-story')?.focus()},
 bpublic:()=>{S.b.modal={t:'public'};render();document.getElementById('mf-name')?.focus()},
 bclose:()=>{S.b.modal=null;render()},
 bsend:()=>{const m=S.b.modal;
  if(m.t==='story'||m.t==='public'){
   const story=val('mf-story'),name=m.t==='public'?val('mf-name'):'';
   if(m.t==='public'&&name.length<2)return ferr('mferr','장소 이름을 입력해 주세요');
   if(story.length<10)return ferr('mferr','스토리를 10자 이상 써 주세요');
   if(m.t==='story')S.b.places.find(x=>x.id===m.id).story=story;
   else S.b.places.push({id:'u'+Date.now(),name,kind:'public',story,from:null,to:null,radius:+val('mf-rad')});
   S.b.modal=null;render();
   return toast(m.t==='story'?'스토리를 저장했어요 · IP 인증 완료<br><span style="opacity:.7">이제 루트 만들기에서 이 장소를 고를 수 있어요</span>':`${esc(name)}을 공공장소로 등록했어요`);
  }
  const s=m.t==='space'?SP(m.id):ME(),from=val('mf-from'),to=val('mf-to'),cap=+val('mf-cap');
  if(!from||!to)return ferr('mferr','기간을 입력해 주세요');
  if(to<from)return ferr('mferr','종료일이 시작일보다 빨라요');
  if(!(cap>=1&&cap<=s.cap))return ferr('mferr',`회차당 인원은 1~${s.cap}명이에요`);
  const ops=[...document.querySelectorAll('[name=mf-op]:checked')].map(x=>x.value);
  if(document.getElementById('mf-etc-on')?.checked){const etc=val('mf-etc');if(!etc)return ferr('mferr','기타 항목 내용을 적어 주세요');ops.push(etc)}
  if(!ops.length)return ferr('mferr','항목을 하나 이상 골라 주세요');
  const base={id:'n'+Date.now(),dir:'out',from,to,cap,menu:val('mf-menu')||'—',status:'wait'};
  if(m.t==='space'){S.b.props.push({...base,side:'ip',who:s.name,space:s.id,ops});S.b.tab.ip='out'}
  else{const a=A(m.id);S.b.props.push({...base,side:'space',who:`${a.name} · ${a.agency}`,ip:a.id,ops:[...ops,'팝업'],popup:true,msg:val('mf-msg')});S.b.tab.space='out'}
  S.b.modal=null;render();
  toast(`${m.t==='space'?esc(s.name)+'에 협업 제안':esc(A(m.id).name)+'에 협업 신청'}을 보냈어요<br><span style="opacity:.7">협업함에서 확인할 수 있어요</span>`)},
 bformx:()=>{S.b.modal.form=false;render()},
 btab:d=>{S.b.tab[d.side]=d.t;S.b.editing=null;render()},
 bacc:d=>{const p=prop(d.id);p.status='active';
  if(p.side==='ip'&&!S.b.places.some(x=>x.id===p.space))S.b.places.push({id:p.space,name:p.who,kind:p.popup?'popup':'space',story:'',from:p.from,to:p.to,radius:null});
  render();toast(p.side==='ip'?'협업을 시작했어요<br><span style="opacity:.7">장소 관리에서 스토리를 쓰면 IP 인증이 끝나요</span>':'협업을 시작했어요<br><span style="opacity:.7">소속사가 스토리를 쓰고 회차를 열면 캘린더에 도착 예정 인원이 들어와요</span>')},
 bdec:d=>{prop(d.id).status='declined';render();toast('거절했어요')},
 kbotx:()=>{S.b.bot=null;render()},
 bcounter:d=>{S.b.editing=d.id;render();document.getElementById('ce-cap')?.focus()},
 bcancel:()=>{S.b.editing=null;render()},
 bcsend:d=>{const p=prop(d.id),to=val('ce-to'),cap=+val('ce-cap'),max=p.side==='space'?ME().cap:SP(p.space).cap;
  if(!to||to<p.from)return ferr('ferr-'+p.id,'종료일은 시작일 뒤여야 해요');
  if(!(cap>=1&&cap<=max))return ferr('ferr-'+p.id,`회차당 인원은 1~${max}명이에요`);
  Object.assign(p,{to,cap,menu:val('ce-menu')||'—',status:'countered'});S.b.editing=null;render();toast('수정 제안을 보냈어요. 상대가 수락하면 협업이 시작돼요')},
 bcell:d=>{const [i,j]=d.k.split('-').map(Number);
  if(BOOK[i][j])return toast('예약이 있는 시간은 막을 수 없어요');
  S.b.blocked.has(d.k)?S.b.blocked.delete(d.k):S.b.blocked.add(d.k);render()},
 bday:d=>{const i=+d.d,ks=CAL_SLOTS.map((_,j)=>i+'-'+j),off=ks.every(k=>S.b.blocked.has(k));
  if(!off&&BOOK[i].some(Boolean))return toast('예약이 있는 날은 하루 전체를 막을 수 없어요');
  ks.forEach(k=>off?S.b.blocked.delete(k):S.b.blocked.add(k));render()},
 baiok:d=>{const a=S.b.ai[+d.i],s=ME();a.st='ok';(a.cat==='분위기'?s.vibe:s.feat).push(a.tag);render();toast(`'${a.tag}' 태그를 공개했어요 · 공간찾기에 바로 반영돼요`)},
 baino:d=>{S.b.ai[+d.i].st='no';render();toast('거절한 태그는 다시 분석해도 제안하지 않아요')},
 payLink:()=>{S.payLink=!S.payLink;render()},
 ipcat:d=>{S.b.ipq.cat=d.v;render()},
 ipopen:()=>{S.b.ipq.open=!S.b.ipq.open;render()},
 bplan:d=>{S.b.bill.plan=d.v;render()},
 bcur:d=>{S.b.bill.cur=d.v;render()},
 blang:d=>{S.b.bill.lang=d.v;render()},
 bmethod:d=>{S.b.bill.method=d.v;render()},
 bnew:()=>{Object.assign(S.b.bill,{paid:null,agree:[false,false,false]});render(true);window.scrollTo(0,0)},
 bpay:()=>{const b=S.b.bill,f=b.form,kr=b.country==='KR',has=k=>(f[k]||'').trim();
  if((kr?['camp','start','company','bizno','ceo','contact','email']:['camp','start','company','contact','addr','city','zip','email']).some(k=>!has(k)))return ferr('bberr',bt('e_req'));
  if(dday(f.start)<0||dday(f.start)>30)return ferr('bberr',bt('e_start'));
  if(kr&&f.bizno.replace(/\D/g,'').length!==10)return ferr('bberr',bt('e_biz'));
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim()))return ferr('bberr',bt('e_mail'));
  if(!b.agree.every(Boolean))return ferr('bberr',bt('e_agree'));
  const q=quote(b),pending=OFFLINE.has(b.method);
  b.paid={no:(kr?'KR':'INV')+'-261107-'+String(Date.now()).slice(-4),plan:q.p,total:q.total,cur:b.cur,start:f.start,camp:f.camp,kr,pending};
  render(true);window.scrollTo(0,0);toast(esc(bt(pending?'toastPend':'toastOk')))},
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&S.b.modal){S.b.modal=null;render()}
 if(e.key==='Enter'&&!e.isComposing&&e.target.id==='bq'){e.preventDefault();ACT.bsearch()}
});
document.addEventListener('mouseover',e=>{
 const id=e.target.closest?.('[data-hover]')?.dataset.hover;
 document.querySelectorAll('.mpin.hot').forEach(g=>g.classList.remove('hot'));
 if(id)document.querySelector(`.mpin[data-pin="${id}"]`)?.classList.add('hot');
});
document.addEventListener('input',e=>{
 if(e.target.id==='rt-persona')S.b.rt.persona=e.target.value;
 if(e.target.id==='mf-etc')document.getElementById('mf-etc-on').checked=!!e.target.value.trim();
 if(e.target.id==='ipq'){S.b.ipq.text=e.target.value;ipFilterText()}
 const bk=e.target.dataset.bbind;if(bk)S.b.bill.form[bk]=e.target.value;
 const k=e.target.dataset.sbind;if(k){const s=ME();s[k]=e.target.type==='number'?+e.target.value:e.target.value}
 if(e.target.id==='bcap'){const v=+e.target.value;if(v>=1&&v<=40){S.b.slotCap=v;render();const c=document.getElementById('bcap');c.focus()}}
});
document.addEventListener('change',e=>{
 const ba=e.target.dataset.bagree;if(ba!=null)S.b.bill.agree[+ba]=e.target.checked;
 const bo=e.target.dataset.badd;if(bo){S.b.bill.add[bo]=e.target.checked;render()}
 if(e.target.id==='bb-country')setCountry(e.target.value);
 const c=e.target.dataset.scol;if(c){const s=ME();e.target.checked?s.collab.push(c):s.collab.splice(s.collab.indexOf(c),1)}
});

rollNick();
render(true);
</script>
</body>
</html>
